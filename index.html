<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orumi</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Orumi</a>
    <nav>
      <a href="/studio/">Studio</a>
      <a href="/language/">Language</a>
      <a href="/play/">Play</a>
    </nav>
  </header>

  <main class="hero">
    <section>
      <p class="eyebrow">Orumi Studio</p>
      <h1>A visual music language made of colored squares.</h1>
      <p class="lede">
        Build melodies, rhythms, rests, octaves, volume, and sustain as visible patterns —
        first on screen, eventually in your hands.
      </p>
      <div class="actions">
        <a class="button" href="/studio/">Enter Orumi Studio</a>
        <a class="button secondary" href="/language/">Learn the Language</a>
      </div>
    </section>

    <section class="grid-demo" aria-label="Orumi square grid">
      <span class="sq red"></span>
      <span class="sq orange"></span>
      <span class="sq yellow"></span>
      <span class="sq green"></span>
      <span class="sq blue"></span>
      <span class="sq purple"></span>
      <span class="sq white"></span>
      <span class="sq black"></span>
      <span class="sq teal"></span>
    </section>
  </main>
</body>
</html>
