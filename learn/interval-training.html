<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Orumi Interval Training</title>

  <style>
    :root {
      --orumi-bg: #0f1115;
      --orumi-panel: #171a21;
      --orumi-panel-2: #202431;
      --orumi-text: #f5f2e9;
      --orumi-muted: #b9b3a4;
      --orumi-soft: #8f8878;
      --orumi-gold: #d6b76a;
      --orumi-gold-soft: rgba(214, 183, 106, 0.18);
      --orumi-red: #d85c5c;
      --orumi-blue: #5a8dee;
      --orumi-yellow: #e7c85f;
      --orumi-green: #67b26f;
      --orumi-purple: #9b7de3;

/* Orumi pitch colors */
--note-c: #ff6b6b;
--note-d: #f7b267;
--note-e: #ffd93d;
--note-f: #6bcb77;
--note-g: #4d96ff;
--note-a: #9d4edd;
--note-b: #ff8fab;
--note-bb: linear-gradient(135deg, #9d4edd, #ff8fab);
--note-eb: linear-gradient(135deg, #f7b267, #ffd93d);

--orumi-border: rgba(255, 255, 255, 0.11);
      --orumi-shadow: rgba(0, 0, 0, 0.35);
      --radius-large: 22px;
      --radius-medium: 16px;
      --radius-small: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(214, 183, 106, 0.14), transparent 34%),
        radial-gradient(circle at bottom right, rgba(90, 141, 238, 0.11), transparent 32%),
        var(--orumi-bg);
      color: var(--orumi-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .note-c {
  --note-color: var(--note-c);
  --note-glow: rgba(255, 107, 107, 0.58);
  --note-text: white;
}

.note-d {
  --note-color: var(--note-d);
  --note-glow: rgba(247, 178, 103, 0.58);
  --note-text: white;
}

.note-e {
  --note-color: var(--note-e);
  --note-glow: rgba(255, 217, 61, 0.58);
  --note-text: #222;
}

.note-eb {
  --note-color: var(--note-eb);
  --note-glow: rgba(255, 198, 82, 0.58);
  --note-text: #222;
}

.note-f {
  --note-color: var(--note-f);
  --note-glow: rgba(107, 203, 119, 0.58);
  --note-text: white;
}

.note-g {
  --note-color: var(--note-g);
  --note-glow: rgba(77, 150, 255, 0.58);
  --note-text: white;
}

.note-a {
  --note-color: var(--note-a);
  --note-glow: rgba(157, 78, 221, 0.58);
  --note-text: white;
}

.note-b {
  --note-color: var(--note-b);
  --note-glow: rgba(255, 143, 171, 0.58);
  --note-text: white;
}

.note-bb {
  --note-color: var(--note-bb);
  --note-glow: rgba(220, 110, 205, 0.58);
  --note-text: white;
}

    .page-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background:
        linear-gradient(135deg, var(--orumi-red), var(--orumi-blue) 42%, var(--orumi-yellow) 72%, var(--orumi-green));
      box-shadow: 0 10px 28px var(--orumi-shadow);
      position: relative;
      overflow: hidden;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 8px;
    }

    .brand-text h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw, 2rem);
      letter-spacing: 0.03em;
    }

    .brand-text p {
      margin: 2px 0 0;
      color: var(--orumi-muted);
      font-size: 0.95rem;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018));
      border: 1px solid var(--orumi-border);
      border-radius: var(--radius-large);
      box-shadow: 0 18px 46px var(--orumi-shadow);
      overflow: hidden;
    }

    .sidebar {
      position: sticky;
      top: 18px;
    }

    .sidebar-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--orumi-border);
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--orumi-gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-header p {
      margin: 8px 0 0;
      color: var(--orumi-muted);
      font-size: 0.9rem;
    }

    .lesson-list {
      padding: 10px;
    }

    .lesson-btn {
      width: 100%;
      display: grid;
      grid-template-columns: 32px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px;
      color: var(--orumi-text);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: 160ms ease;
    }

    .lesson-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .lesson-btn.active {
      background: var(--orumi-gold-soft);
      border-color: rgba(214, 183, 106, 0.45);
    }

    .lesson-number {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--orumi-gold);
      font-weight: 700;
      font-size: 0.86rem;
    }

    .lesson-title {
      font-weight: 700;
      font-size: 0.94rem;
    }

    .lesson-subtitle {
      margin-top: 2px;
      color: var(--orumi-muted);
      font-size: 0.78rem;
    }

    .lesson-status {
      color: var(--orumi-soft);
      font-size: 0.78rem;
    }

    .lesson-btn.complete .lesson-status {
      color: var(--orumi-green);
    }

    .progress-box {
      padding: 14px 20px 20px;
      border-top: 1px solid var(--orumi-border);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--orumi-muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--orumi-gold), var(--orumi-green));
      border-radius: 999px;
      transition: width 220ms ease;
    }

    .main-panel {
      min-height: 720px;
    }

    .hero {
      padding: clamp(22px, 4vw, 38px);
      border-bottom: 1px solid var(--orumi-border);
      background:
        linear-gradient(135deg, rgba(214, 183, 106, 0.09), transparent 42%),
        rgba(255, 255, 255, 0.012);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--orumi-gold);
      font-size: 0.83rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--orumi-gold);
      box-shadow: 0 0 16px rgba(214, 183, 106, 0.75);
    }

    .hero h2 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    .hero-question {
      margin: 0;
      color: var(--orumi-muted);
      font-size: clamp(1.08rem, 2vw, 1.35rem);
      max-width: 760px;
    }

    .lesson-stage {
      padding: clamp(20px, 3vw, 34px);
      display: grid;
      grid-template-columns: minmax(260px, 440px) 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .context-card {
  margin: clamp(20px, 3vw, 34px) clamp(20px, 3vw, 34px) 0;
  padding: clamp(20px, 3vw, 30px);
  border-radius: var(--radius-large);
  border: 1px solid rgba(214, 183, 106, 0.24);
  background:
    linear-gradient(135deg, rgba(214, 183, 106, 0.09), transparent 46%),
    rgba(255, 255, 255, 0.035);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
}

.context-card h3 {
  margin: 10px 0 12px;
  font-size: clamp(1.35rem, 2.4vw, 2rem);
  letter-spacing: -0.025em;
}

.context-card p {
  margin: 0 0 12px;
  color: var(--orumi-muted);
  max-width: 920px;
}

.context-card p:last-child {
  margin-bottom: 0;
}

.context-card .sound-places {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}

.context-card .sound-place {
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 7px 10px;
  color: var(--orumi-text);
  background: rgba(255, 255, 255, 0.045);
  font-size: 0.84rem;
}

    .sound-card,
    .visual-card,

    .octave-stage {
  padding: clamp(20px, 3vw, 34px);
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr);
  gap: 24px;
  align-items: stretch;
}

.octave-card {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--orumi-border);
  border-radius: var(--radius-large);
  padding: 22px;
}

.octave-card h3 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.octave-card p {
  margin: 0;
  color: var(--orumi-muted);
}

.string-lab {
  margin-top: 22px;
  display: grid;
  gap: 22px;
}

.string-row {
  display: grid;
  grid-template-columns: 92px 1fr 96px;
  gap: 12px;
  align-items: center;
}

.string-label {
  font-weight: 900;
  color: var(--orumi-text);
}

.string-frequency {
  color: var(--orumi-muted);
  font-weight: 800;
  text-align: right;
}

.string-track {
  position: relative;
  height: 74px;
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.10);
  overflow: hidden;
}

.string-end {
  position: absolute;
  top: 13px;
  bottom: 13px;
  width: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,0.48);
}

.string-end.left {
  left: 14px;
}

.string-end.right {
  right: 14px;
}

.string-line {
  position: absolute;
  left: 18px;
  right: 18px;
  top: 50%;
  height: 5px;
  border-radius: 999px;
  background: var(--note-c, #ff6b6b);
  box-shadow: 0 0 24px rgba(255,107,107,0.58);
  transform: translateY(-50%);
}

.string-line.half {
  right: 50%;
}

.string-wave {
  position: absolute;
  left: 18px;
  right: 18px;
  top: 50%;
  height: 44px;
  transform: translateY(-50%);
  opacity: 0;
  transition: opacity 180ms ease;
}

.string-wave.half {
  right: 50%;
}

.string-track.playing .string-wave {
  opacity: 1;
}

.string-wave svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.string-wave path {
  fill: none;
  stroke: var(--note-c, #ff6b6b);
  stroke-width: 4;
  stroke-linecap: round;
  filter: drop-shadow(0 0 10px rgba(255,107,107,0.8));
}

.string-track.playing.full-string .string-wave path {
  animation: slowString 420ms linear infinite alternate;
}

.string-track.playing.half-string .string-wave path {
  animation: fastString 210ms linear infinite alternate;
}

@keyframes slowString {
  from { transform: translateY(-4px); }
  to { transform: translateY(4px); }
}

@keyframes fastString {
  from { transform: translateY(-6px); }
  to { transform: translateY(6px); }
}

.octave-block-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin: 24px 0;
}

.octave-note-block {
  width: 118px;
  height: 118px;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.18);
  display: grid;
  place-items: center;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.03)),
    var(--note-c, #ff6b6b);
  color: white;
  box-shadow:
    0 18px 34px rgba(0,0,0,0.34),
    0 0 34px rgba(255,107,107,0.42);
  font-weight: 900;
  font-size: 1.8rem;
}

.octave-note-block small {
  display: block;
  margin-top: 4px;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.78);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.octave-arrow {
  color: var(--orumi-gold);
  font-weight: 900;
  font-size: 1.8rem;
}

.length-control {
  margin-top: 20px;
  padding: 18px;
  border-radius: var(--radius-medium);
  background: rgba(0,0,0,0.18);
  border: 1px solid rgba(255,255,255,0.08);
}

.length-control label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-weight: 900;
  color: var(--orumi-text);
  margin-bottom: 12px;
}

.length-control input {
  width: 100%;
  accent-color: var(--note-c, #ff6b6b);
}

.octave-readout {
  margin-top: 12px;
  color: var(--orumi-muted);
  font-weight: 800;
}

.octave-found {
  margin-top: 12px;
  display: none;
  padding: 12px;
  border-radius: var(--radius-medium);
  color: #17130a;
  background: rgba(155,235,215,0.92);
  font-weight: 900;
}

.octave-found.visible {
  display: block;
}

.wave-comparison {
  margin-top: 22px;
  display: grid;
  gap: 18px;
}

.wave-row {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 12px;
  align-items: center;
}

.wave-label {
  font-weight: 900;
}

.wave-panel {
  height: 76px;
  border-radius: 18px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  overflow: hidden;
  padding: 0 16px;
}

.wave-panel svg {
  width: 100%;
  height: 52px;
  overflow: visible;
}

.wave-panel path {
  fill: none;
  stroke: var(--note-c, #ff6b6b);
  stroke-width: 4;
  stroke-linecap: round;
  filter: drop-shadow(0 0 8px rgba(255,107,107,0.62));
}

.alignment-guides {
  display: none;
  margin-top: 14px;
  color: var(--orumi-muted);
  font-size: 0.92rem;
}

.alignment-guides.visible {
  display: block;
}

@media (max-width: 1040px) {
  .octave-stage {
    grid-template-columns: 1fr;
  }
}
    .fifth-stage {
  padding: clamp(20px, 3vw, 34px);
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr);
  gap: 24px;
  align-items: stretch;
}

.fifth-card {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--orumi-border);
  border-radius: var(--radius-large);
  padding: 22px;
}

.fifth-card h3 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.fifth-card p {
  margin: 0;
  color: var(--orumi-muted);
}

.fifth-block-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin: 24px 0;
}

.fifth-note-block {
  width: 122px;
  height: 122px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 24px;
  display: grid;
  place-items: center;
  color: var(--note-text, white);
  background:
    linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.03)),
    var(--note-color);
  box-shadow:
    0 18px 34px rgba(0,0,0,0.34),
    0 0 34px var(--note-glow);
  font-size: 1.9rem;
  font-weight: 900;
  cursor: pointer;
  transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
}

.fifth-note-block:hover {
  transform: translateY(-3px);
  filter: brightness(1.08);
}

.fifth-note-block.playing {
  transform: translateY(2px) scale(0.98);
  box-shadow:
    0 10px 22px rgba(0,0,0,0.38),
    0 0 46px var(--note-glow);
}

.fifth-note-block small {
  display: block;
  margin-top: 5px;
  font-size: 0.74rem;
  color: rgba(255,255,255,0.78);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.fifth-plus {
  color: var(--orumi-gold);
  font-size: 2rem;
  font-weight: 900;
}

.fifth-tuning-game {
  margin-top: 22px;
  padding: 18px;
  border-radius: var(--radius-medium);
  background: rgba(0,0,0,0.18);
  border: 1px solid rgba(255,255,255,0.08);
}

.fifth-tuning-game label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-weight: 900;
  color: var(--orumi-text);
  margin-bottom: 12px;
}

.fifth-tuning-game input {
  width: 100%;
  accent-color: var(--note-g, #4d96ff);
}

.fifth-readout {
  margin-top: 12px;
  color: var(--orumi-muted);
  font-weight: 800;
  line-height: 1.45;
}

.fifth-feedback {
  margin-top: 14px;
  padding: 14px;
  border-radius: var(--radius-medium);
  background: rgba(255,255,255,0.055);
  border: 1px solid rgba(255,255,255,0.10);
  color: var(--orumi-text);
  font-weight: 900;
}

.fifth-feedback.cold {
  border-color: rgba(90,141,238,0.22);
}

.fifth-feedback.warm {
  border-color: rgba(214,183,106,0.42);
  background: rgba(214,183,106,0.10);
}

.fifth-feedback.hot {
  border-color: rgba(77,150,255,0.66);
  background: rgba(77,150,255,0.14);
  box-shadow: 0 0 22px rgba(77,150,255,0.22);
}

.fifth-feedback.locked {
  color: #071424;
  border-color: rgba(255,255,255,0.82);
  background: rgba(155,235,215,0.92);
  box-shadow: 0 0 32px rgba(155,235,215,0.42);
}

.fifth-string-track {
  position: relative;
  height: 88px;
  margin-top: 22px;
  border-radius: 20px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.10);
  overflow: hidden;
}

.fifth-string-base,
.fifth-string-target {
  position: absolute;
  left: 18px;
  top: 50%;
  height: 5px;
  border-radius: 999px;
  transform: translateY(-50%);
}

.fifth-string-base {
  right: 18px;
  background: var(--note-c, #ff6b6b);
  box-shadow: 0 0 22px rgba(255,107,107,0.46);
  opacity: 0.58;
}

.fifth-string-target {
  width: calc((100% - 36px) * 0.6667);
  background: var(--note-g, #4d96ff);
  box-shadow: 0 0 26px rgba(77,150,255,0.62);
}

.fifth-bridge {
  position: absolute;
  top: 18px;
  bottom: 18px;
  width: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,0.72);
  box-shadow: 0 0 16px rgba(255,255,255,0.5);
}

.fifth-wave-lock {
  margin-top: 22px;
  display: grid;
  gap: 14px;
}

.fifth-wave-row {
  display: grid;
  grid-template-columns: 74px 1fr;
  gap: 12px;
  align-items: center;
}

.fifth-wave-label {
  font-weight: 900;
}

.fifth-wave-panel {
  height: 70px;
  border-radius: 18px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  overflow: hidden;
  padding: 0 16px;
}

.fifth-wave-panel svg {
  width: 100%;
  height: 50px;
  overflow: visible;
}

.fifth-wave-panel path {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
}

.fifth-wave-panel .wave-c {
  stroke: var(--note-c, #ff6b6b);
  filter: drop-shadow(0 0 8px rgba(255,107,107,0.62));
}

.fifth-wave-panel .wave-g {
  stroke: var(--note-g, #4d96ff);

    function createSustainableVoice(ctx, frequency, startTime, duration, gainValue) {
  const output = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  filter.type = "lowpass";
  filter.frequency.setValueAtTime(2400, startTime);
  filter.Q.setValueAtTime(0.75, startTime);

  output.gain.setValueAtTime(0.0001, startTime);
  output.gain.exponentialRampToValueAtTime(gainValue, startTime + 0.18);
  output.gain.setValueAtTime(gainValue, startTime + Math.max(0.2, duration - 0.9));
  output.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

  const vibrato = ctx.createOscillator();
  const vibratoGain = ctx.createGain();

  vibrato.type = "sine";
  vibrato.frequency.setValueAtTime(4.8, startTime);
  vibratoGain.gain.setValueAtTime(frequency * 0.0025, startTime);

  const sine = ctx.createOscillator();
  const triangle = ctx.createOscillator();

  const sineGain = ctx.createGain();
  const triangleGain = ctx.createGain();

  sine.type = "sine";
  triangle.type = "triangle";

  sine.frequency.setValueAtTime(frequency, startTime);
  triangle.frequency.setValueAtTime(frequency, startTime);

  sineGain.gain.setValueAtTime(0.82, startTime);
  triangleGain.gain.setValueAtTime(0.18, startTime);

  vibrato.connect(vibratoGain);
  vibratoGain.connect(sine.frequency);
  vibratoGain.connect(triangle.frequency);

  sine.connect(sineGain);
  triangle.connect(triangleGain);

  sineGain.connect(filter);
  triangleGain.connect(filter);
  filter.connect(output);

  sine.start(startTime);
  triangle.start(startTime);
  vibrato.start(startTime);

  sine.stop(startTime + duration + 0.1);
  triangle.stop(startTime + duration + 0.1);
  vibrato.stop(startTime + duration + 0.1);

  return output;
}

function playRootWithSoftOvertones() {
  const ctx = getAudioContext();

  if (ctx.state === "suspended") {
    ctx.resume();
  }

  const now = ctx.currentTime;
  const masterGain = ctx.createGain();

  masterGain.gain.setValueAtTime(0.82, now);
  masterGain.connect(ctx.destination);

  overtones.slice(0, 5).forEach((tone, index) => {
    const duration = 2.1;
    const gain = index === 0 ? 0.16 : 0.035 / (index + 1);
    const voice = createSustainableVoice(ctx, tone.frequency, now, duration, gain);
    voice.connect(masterGain);
  });

  const block = document.getElementById("rootBlock");
  if (block) {
    block.classList.add("playing");
    setTimeout(() => block.classList.remove("playing"), 1200);
  }
}

function playOctaveTone(mode) {

function playSimpleTone(ctx, frequency, startTime, duration, gainValue) {
  const scheduleTone = () => {
    const safeStartTime = Math.max(ctx.currentTime + 0.03, startTime || 0);

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    oscillator.type = "triangle";
    oscillator.frequency.setValueAtTime(frequency, safeStartTime);

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1800, safeStartTime);

    gain.gain.setValueAtTime(0.0001, safeStartTime);
    gain.gain.exponentialRampToValueAtTime(gainValue, safeStartTime + 0.04);
    gain.gain.setValueAtTime(gainValue, safeStartTime + Math.max(0.08, duration - 0.18));
    gain.gain.exponentialRampToValueAtTime(0.0001, safeStartTime + duration);

    oscillator.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(safeStartTime);
    oscillator.stop(safeStartTime + duration + 0.1);
  };

  if (ctx.state === "running") {
    scheduleTone();
    return;
  }

  ctx.resume()
    .then(scheduleTone)
    .catch((error) => {
      console.warn("Audio could not start:", error);
    });
}

    function handleFifthLengthChange(event) {
  const lengthPercent = Number(event.target.value);
  const baseFrequency = 130.81;
  const targetLength = 66.67;
  const frequency = baseFrequency / (lengthPercent / 100);
  const ratio = frequency / baseFrequency;
  const distance = Math.abs(lengthPercent - targetLength);

  const lengthLabel = document.getElementById("fifthLengthPercent");
  const readout = document.getElementById("fifthReadout");
  const feedback = document.getElementById("fifthFeedback");
  const bridge = document.getElementById("fifthBridge");
  const currentTone = document.getElementById("fifthCurrentTone");

  if (lengthLabel) {
    lengthLabel.textContent = `${lengthPercent.toFixed(2)}%`;
  }

  if (readout) {
  readout.textContent =
    `Ground: C · Target: F · Length: ${lengthPercent.toFixed(2)}% · Frequency: ${frequency.toFixed(2)} Hz · Ratio: ${ratio.toFixed(3)}:1`;
}

  if (bridge) {
    const leftPercent = Math.max(0, Math.min(100, lengthPercent));
    bridge.style.left = `calc(18px + (100% - 36px) * ${leftPercent / 100})`;
  }

  if (!feedback) return;

  feedback.classList.remove("cold", "warm", "hot", "locked");

  let message = "";

  if (distance <= 0.35) {
    feedback.classList.add("locked");
    message = "Perfect fifth found: two-thirds of the string, three-halves of the frequency.";

    if (currentTone) {
      currentTone.innerHTML = `
        <h4>Perfect fifth found · G · 3:2</h4>
        <p>
          The string is almost exactly two-thirds as long. The frequency is almost
          exactly three-halves of C. This is the first strong other.
        </p>
      `;
    }
  } else if (distance <= 2.0) {
    feedback.classList.add("hot");
    message = lengthPercent > targetLength
      ? "Hot — you are very close. Make the string just a little shorter."
      : "Hot — you are very close. Make the string just a little longer.";
  } else if (distance <= 6.0) {
    feedback.classList.add("warm");
    message = lengthPercent > targetLength
      ? "Warm — getting close. Shorten the string."
      : "Warm — getting close. Lengthen the string.";
  } else {
    feedback.classList.add("cold");
    message = lengthPercent > targetLength
      ? "Too low — make the string shorter."
      : "Too high — make the string longer.";
  }

  feedback.textContent = message;
}

let fourthPerspectiveInverted = false;

function playFourthPerspective() {
  const ctx = getAudioContext();

  if (ctx.state === "suspended") {
    ctx.resume();
  }

  const now = ctx.currentTime;

  if (fourthPerspectiveInverted) {
    playSimpleTone(ctx, 196.00, now, 0.9, 0.2);
    playSimpleTone(ctx, 261.63, now + 0.72, 1.2, 0.2);
    pulseFourthBlock("fourthFirstBlock", 900);
    setTimeout(() => pulseFourthBlock("fourthSecondBlock", 1200), 720);
    setFourthCurrentTone(
      "G → C · Perfect fourth",
      "The same two notes have turned around. From G, the path back to C is a fourth."
    );
  } else {
    playSimpleTone(ctx, 130.81, now, 0.9, 0.2);
    playSimpleTone(ctx, 196.00, now + 0.72, 1.2, 0.2);
    pulseFourthBlock("fourthFirstBlock", 900);
    setTimeout(() => pulseFourthBlock("fourthSecondBlock", 1200), 720);
    setFourthCurrentTone(
      "C → G · Perfect fifth",
      "From C, G feels like the first strong other: the perfect fifth."
    );
  }
}

function turnFourthPerspectiveAround() {
  fourthPerspectiveInverted = !fourthPerspectiveInverted;

  const label = document.getElementById("fourthPerspectiveLabel");
  const first = document.getElementById("fourthFirstBlock");
  const second = document.getElementById("fourthSecondBlock");

  if (!label || !first || !second) return;

  if (fourthPerspectiveInverted) {
    label.textContent = "G → C · Perfect Fourth";
    first.className = "fourth-note-block note-g";
    first.innerHTML = "<div>G<small>Ground</small></div>";
    second.className = "fourth-note-block note-c";
    second.innerHTML = "<div>C<small>Fourth</small></div>";

    setFourthCurrentTone(
      "The fifth has turned around",
      "C to G was a fifth. G to C is a fourth. The notes stayed the same, but the ground changed."
    );
  } else {
    label.textContent = "C → G · Perfect Fifth";
    first.className = "fourth-note-block note-c";
    first.innerHTML = "<div>C<small>Ground</small></div>";
    second.className = "fourth-note-block note-g";
    second.innerHTML = "<div>G<small>Fifth</small></div>";

    setFourthCurrentTone(
      "Back to the fifth",
      "From C, G feels like the first strong other: open, stable, and spacious."
    );
  }
}

function handleFourthLengthChange(event) {
  const lengthPercent = Number(event.target.value);
  const baseFrequency = 130.81;
  const targetLength = 75;
  const frequency = baseFrequency / (lengthPercent / 100);
  const ratio = frequency / baseFrequency;
  const distance = Math.abs(lengthPercent - targetLength);

  const lengthLabel = document.getElementById("fourthLengthPercent");
  const readout = document.getElementById("fourthReadout");
  const feedback = document.getElementById("fourthFeedback");
  const bridge = document.getElementById("fourthBridge");

  if (lengthLabel) {
    lengthLabel.textContent = `${lengthPercent.toFixed(2)}%`;
  }

  if (readout) {
    readout.textContent =
      `Length: ${lengthPercent.toFixed(2)}% · Frequency: ${frequency.toFixed(2)} Hz · Ratio: ${ratio.toFixed(3)}:1`;
  }

  if (bridge) {
    bridge.style.left = `calc(18px + (100% - 36px) * ${lengthPercent / 100})`;
  }

  if (!feedback) return;

  feedback.classList.remove("warm", "hot", "locked");

  let message = "";

  if (distance <= 0.35) {
    feedback.classList.add("locked");
    message = "F found: the fourth above C. The string is three-fourths as long, and the frequency is four-thirds of C.";

    setFourthCurrentTone(
  "F found above C · Perfect fourth · 4:3",
  "This is the second way to meet the fourth: keep C as the ground and rise to F. C is red. F is green."
);
  } else if (distance <= 2.0) {
    feedback.classList.add("hot");
    message = lengthPercent > targetLength
      ? "Hot — very close. Make the string just a little shorter."
      : "Hot — very close. Make the string just a little longer.";
  } else if (distance <= 5.0) {
    feedback.classList.add("warm");
    message = lengthPercent > targetLength
      ? "Warm — getting close. Shorten the string."
      : "Warm — getting close. Lengthen the string.";
  } else {
    message = lengthPercent > targetLength
  ? "Too low for F — make the C string shorter."
  : "Too high for F — make the C string longer.";
  }

  feedback.textContent = message;
}

function resolveFourthToThird() {

function handleThirdLengthChange(event) {
  const lengthPercent = Number(event.target.value);
  const baseFrequency = 130.81;
  const targetLength = 80;
  const frequency = baseFrequency / (lengthPercent / 100);
  const ratio = frequency / baseFrequency;
  const distance = Math.abs(lengthPercent - targetLength);

  const lengthLabel = document.getElementById("thirdLengthPercent");
  const readout = document.getElementById("thirdReadout");
  const feedback = document.getElementById("thirdFeedback");
  const bridge = document.getElementById("thirdBridge");

  if (lengthLabel) {
    lengthLabel.textContent = `${lengthPercent.toFixed(2)}%`;
  }

  if (readout) {
    readout.textContent =
      `Ground: C · Target: E · Length: ${lengthPercent.toFixed(2)}% · Frequency: ${frequency.toFixed(2)} Hz · Ratio: ${ratio.toFixed(3)}:1`;
  }

  if (bridge) {
    bridge.style.left = `calc(18px + (100% - 36px) * ${lengthPercent / 100})`;
  }

  if (!feedback) return;

  feedback.classList.remove("warm", "hot", "locked");

  let message = "";

  if (distance <= 0.35) {
    feedback.classList.add("locked");
    message = "E found: the major third above C. The string is four-fifths as long, and the frequency is five-fourths of C.";

    setThirdIntervalTone(
      "E found above C · Major third · 5:4",
      "C is red. E is yellow. The chord now has brightness, warmth, and color."
    );
  } else if (distance <= 2.0) {
    feedback.classList.add("hot");
    message = lengthPercent > targetLength
      ? "Hot — very close. Shorten the C string just a little."
      : "Hot — very close. Lengthen the C string just a little.";
  } else if (distance <= 5.0) {
    feedback.classList.add("warm");
    message = lengthPercent > targetLength
      ? "Warm — getting close. Shorten the C string."
      : "Warm — getting close. Lengthen the C string.";
  } else {
    message = lengthPercent > targetLength
      ? "Too low for E — make the C string shorter."
      : "Too high for E — make the C string longer.";
  }

  feedback.textContent = message;
}

    feeling: "Yes. The third gives the chord its emotional face.",
    pull: "Yes. The seventh gives color a destination. It makes the ear ask what comes next.",
    overtone: "Yes. The lowered seventh is tied to the seventh partial: a real overtone color with its own gravity, though farther from the root's simplest pulls.",
    all: "Exactly. The seventh is magnetized color: born from overtone color, but seeking resolution toward simpler relationships."
  };

  responseBox.innerHTML = `
    <strong>Good noticing.</strong>
    <p style="margin: 6px 0 0; color: var(--orumi-muted);">${responses[choice]}</p>
  `;

  responseBox.classList.add("visible");
}

    function renderPlaceholderLesson(lesson) {
      mainPanel.innerHTML = `
        <section class="hero">
          <div class="eyebrow">Lesson ${lesson.number} · ${lesson.level}</div>
          <h2>${lesson.title}</h2>
          <p class="hero-question">${lesson.subtitle}</p>
        </section>

        <section class="placeholder-lesson">
          <div class="placeholder-card">
            <h3>This session is outlined and ready to build next.</h3>
            <p>
              The learning path is already clickable so learners can see where they are going.
              This lesson can be developed after the overtone foundation is working well.
            </p>

            <div class="pill-row">
              <span class="pill">Hear</span>
              <span class="pill">See</span>
              <span class="pill">Feel</span>
              <span class="pill">Resolve</span>
              <span class="pill">Build</span>
            </div>

            <div class="controls">
              <button class="btn" id="backToLessonOneBtn">Return to Lesson 1</button>
              <button class="btn primary" id="markPlaceholderCompleteBtn">Mark this lesson complete</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById("backToLessonOneBtn").addEventListener("click", () => {
        currentLessonIndex = 0;
        renderLessonList();
        renderCurrentLesson();
        saveProgress();
      });

      document.getElementById("markPlaceholderCompleteBtn").addEventListener("click", completeCurrentLesson);
    }

    async function playOvertoneSequence() {
  if (isPlayingSequence) return;

  isPlayingSequence = true;

  const ctx = getAudioContext();

  if (ctx.state === "suspended") {
    await ctx.resume();
  }

  const revealBtn = document.getElementById("revealBtn");
  const lingerToggle = document.getElementById("lingerToggle");

  const stepDelay = lingerToggle && lingerToggle.checked ? 1300 : 850;
  const totalDuration = (overtones.length * stepDelay) / 1000 + 3.5;
  const startTime = ctx.currentTime + 0.08;

  const masterGain = ctx.createGain();
  const compressor = ctx.createDynamicsCompressor();

  masterGain.gain.setValueAtTime(0.72, startTime);

  compressor.threshold.setValueAtTime(-18, startTime);
  compressor.knee.setValueAtTime(18, startTime);
  compressor.ratio.setValueAtTime(4, startTime);
  compressor.attack.setValueAtTime(0.02, startTime);
  compressor.release.setValueAtTime(0.35, startTime);

  masterGain.connect(compressor);
  compressor.connect(ctx.destination);

  if (revealBtn) {
    revealBtn.disabled = true;
    revealBtn.textContent = "Blooming…";
  }

  clearOvertoneReveal();

  overtones.forEach((tone, index) => {
    const toneStart = startTime + (index * stepDelay) / 1000;
    const remainingDuration = Math.max(2.2, totalDuration - (index * stepDelay) / 1000);

    const baseGain = 0.15;
    const overtoneGain = baseGain * tone.amplitude * Math.pow(0.82, index);

    const voice = createSustainableVoice(
      ctx,
      tone.frequency,
      toneStart,
      remainingDuration,
      Math.max(0.012, overtoneGain)
    );

    voice.connect(masterGain);

    setTimeout(() => {
      revealedToneIndex = index;
      revealTone(index);
    }, index * stepDelay);
  });

  setTimeout(() => {
    showFullOvertoneBloom();
  }, overtones.length * stepDelay + 400);

  setTimeout(() => {
    showReflection();
    isPlayingSequence = false;

    if (revealBtn) {
      revealBtn.disabled = false;
      revealBtn.textContent = "Bloom again";
    }
  }, totalDuration * 1000);
}

    function revealTone(index) {
      const tone = overtones[index];

      overtones.forEach((_, i) => {
        document.getElementById(`ghostTone-${i}`)?.classList.remove("active");
        document.getElementById(`bar-${i}`)?.classList.remove("active");
      });

      const ghost = document.getElementById(`ghostTone-${index}`);
      const bar = document.getElementById(`bar-${index}`);
      const currentTone = document.getElementById("currentTone");

      if (ghost) {
        ghost.classList.add("visible", "active");
      }

      if (bar) {
        bar.classList.add("visible", "active");
        bar.style.height = `${tone.graphHeight}px`;
      }

      if (currentTone) {
        currentTone.innerHTML = `
          <h4>${tone.number}. ${tone.label} · ${tone.ratio}</h4>
          <p>${tone.description}</p>
        `;
      }
    }

    function clearOvertoneReveal() {
      revealedToneIndex = -1;

      overtones.forEach((tone, index) => {
        const ghost = document.getElementById(`ghostTone-${index}`);
        const bar = document.getElementById(`bar-${index}`);

        if (ghost) {
          ghost.classList.remove("visible", "active");
        }

        if (bar) {
          bar.classList.remove("visible", "active");
          bar.style.height = "8px";
        }
      });

      const currentTone = document.getElementById("currentTone");
      const reflectionCard = document.getElementById("reflectionCard");
      const responseBox = document.getElementById("responseBox");

      if (currentTone) {
        currentTone.innerHTML = `
          <h4>Ready</h4>
          <p>Press “Reveal hidden tones” to hear and see the hidden structure of the note.</p>
        `;
      }

      if (reflectionCard) {
        reflectionCard.classList.remove("visible");
      }

      if (responseBox) {
        responseBox.classList.remove("visible");
        responseBox.innerHTML = "";
      }

      document.querySelectorAll(".choice-btn").forEach((button) => {
        button.classList.remove("selected");
      });
    }

    function restoreVisibleOvertones() {
      if (revealedToneIndex < 0) return;

      for (let i = 0; i <= revealedToneIndex; i++) {
        const tone = overtones[i];
        const ghost = document.getElementById(`ghostTone-${i}`);
        const bar = document.getElementById(`bar-${i}`);

        if (ghost) {
          ghost.classList.add("visible");
        }

        if (bar) {
          bar.classList.add("visible");
          bar.style.height = `${tone.graphHeight}px`;
        }
      }
    }


    function showFullOvertoneBloom() {
  overtones.forEach((tone, index) => {
    const ghost = document.getElementById(`ghostTone-${index}`);
    const bar = document.getElementById(`bar-${index}`);

    if (ghost) {
      ghost.classList.add("visible");
      ghost.classList.remove("active");
    }

    if (bar) {
      bar.classList.add("visible");
      bar.classList.remove("active");
      bar.style.height = `${tone.graphHeight}px`;
    }
  });

  const currentTone = document.getElementById("currentTone");

  if (currentTone) {
    currentTone.innerHTML = `
      <h4>The hidden chord is blooming</h4>
      <p>
        Each tone entered one at a time, but the earlier tones remained softly present.
        This lets you hear the note not as a single point, but as a living stack of relationships.
      </p>
    `;
  }
}

    function showReflection() {
      const reflectionCard = document.getElementById("reflectionCard");
      if (reflectionCard) {
        reflectionCard.classList.add("visible");
        reflectionCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function handleReflectionChoice(button) {
      const choice = button.dataset.choice;
      const responseBox = document.getElementById("responseBox");

      document.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");

      const responses = {
        octave: "Yes. The octave feels like sameness at another height. It is recognition, return, and identity.",
        fifth: "Yes. The fifth is one of the strongest relationships in sound. It often feels open, stable, spacious, and foundational.",
        third: "The third adds emotional color. It begins to make the sound feel bright, warm, human, or tender.",
        seventh: "The seventh-like overtone adds color and tension. It does not simply rest; it begins to want movement."
      };

      responseBox.innerHTML = `
        <strong>Good noticing.</strong>
        <p style="margin: 6px 0 0; color: var(--orumi-muted);">${responses[choice]}</p>
      `;

      responseBox.classList.add("visible");
    }

    function completeCurrentLesson() {
      const lesson = lessons[currentLessonIndex];
      completedLessonIds.add(lesson.id);
      saveProgress();
      renderLessonList();
      updateProgressUI();

      if (autoAdvanceToggle.checked && currentLessonIndex < lessons.length - 1) {
        currentLessonIndex += 1;
        revealedToneIndex = -1;
        renderLessonList();
        renderCurrentLesson();
        saveProgress();
      }
    }

    function saveProgress() {
      const data = {
        currentLessonIndex,
        completedLessonIds: Array.from(completedLessonIds),
        autoAdvance: autoAdvanceToggle.checked
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      updateProgressUI();

      saveProgressBtn.textContent = "Saved";
      setTimeout(() => {
        saveProgressBtn.textContent = "Save progress";
      }, 900);
    }

    function loadProgress() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;

      try {
        const data = JSON.parse(raw);

        currentLessonIndex = Number.isInteger(data.currentLessonIndex)
          ? Math.min(Math.max(data.currentLessonIndex, 0), lessons.length - 1)
          : 0;

        completedLessonIds = new Set(Array.isArray(data.completedLessonIds) ? data.completedLessonIds : []);
        autoAdvanceToggle.checked = Boolean(data.autoAdvance);
      } catch (error) {
        console.warn("Could not load Orumi interval progress.", error);
      }
    }

    function resetProgress() {
      localStorage.removeItem(STORAGE_KEY);
      currentLessonIndex = 0;
      completedLessonIds = new Set();
      revealedToneIndex = -1;
      autoAdvanceToggle.checked = false;
      renderLessonList();
      renderCurrentLesson();
      updateProgressUI();
    }

    function updateProgressUI() {
      const percent = Math.round((completedLessonIds.size / lessons.length) * 100);
      progressFill.style.width = `${percent}%`;
      progressText.textContent = `${percent}%`;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    init();
  </script>
