<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Orumi Interval Training</title>

  <style>
    :root {
      --orumi-bg: #0f1115;
      --orumi-panel: #171a21;
      --orumi-panel-2: #202431;
      --orumi-text: #f5f2e9;
      --orumi-muted: #b9b3a4;
      --orumi-soft: #8f8878;
      --orumi-gold: #d6b76a;
      --orumi-gold-soft: rgba(214, 183, 106, 0.18);
      --orumi-red: #d85c5c;
      --orumi-blue: #5a8dee;
      --orumi-yellow: #e7c85f;
      --orumi-green: #67b26f;
      --orumi-purple: #9b7de3;
      --orumi-border: rgba(255, 255, 255, 0.11);
      --orumi-shadow: rgba(0, 0, 0, 0.35);
      --radius-large: 22px;
      --radius-medium: 16px;
      --radius-small: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(214, 183, 106, 0.14), transparent 34%),
        radial-gradient(circle at bottom right, rgba(90, 141, 238, 0.11), transparent 32%),
        var(--orumi-bg);
      color: var(--orumi-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .page-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background:
        linear-gradient(135deg, var(--orumi-red), var(--orumi-blue) 42%, var(--orumi-yellow) 72%, var(--orumi-green));
      box-shadow: 0 10px 28px var(--orumi-shadow);
      position: relative;
      overflow: hidden;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 8px;
    }

    .brand-text h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw, 2rem);
      letter-spacing: 0.03em;
    }

    .brand-text p {
      margin: 2px 0 0;
      color: var(--orumi-muted);
      font-size: 0.95rem;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018));
      border: 1px solid var(--orumi-border);
      border-radius: var(--radius-large);
      box-shadow: 0 18px 46px var(--orumi-shadow);
      overflow: hidden;
    }

    .sidebar {
      position: sticky;
      top: 18px;
    }

    .sidebar-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--orumi-border);
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--orumi-gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-header p {
      margin: 8px 0 0;
      color: var(--orumi-muted);
      font-size: 0.9rem;
    }

    .lesson-list {
      padding: 10px;
    }

    .lesson-btn {
      width: 100%;
      display: grid;
      grid-template-columns: 32px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px;
      color: var(--orumi-text);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: 160ms ease;
    }

    .lesson-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .lesson-btn.active {
      background: var(--orumi-gold-soft);
      border-color: rgba(214, 183, 106, 0.45);
    }

    .lesson-number {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--orumi-gold);
      font-weight: 700;
      font-size: 0.86rem;
    }

    .lesson-title {
      font-weight: 700;
      font-size: 0.94rem;
    }

    .lesson-subtitle {
      margin-top: 2px;
      color: var(--orumi-muted);
      font-size: 0.78rem;
    }

    .lesson-status {
      color: var(--orumi-soft);
      font-size: 0.78rem;
    }

    .lesson-btn.complete .lesson-status {
      color: var(--orumi-green);
    }

    .progress-box {
      padding: 14px 20px 20px;
      border-top: 1px solid var(--orumi-border);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--orumi-muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--orumi-gold), var(--orumi-green));
      border-radius: 999px;
      transition: width 220ms ease;
    }

    .main-panel {
      min-height: 720px;
    }

    .hero {
      padding: clamp(22px, 4vw, 38px);
      border-bottom: 1px solid var(--orumi-border);
      background:
        linear-gradient(135deg, rgba(214, 183, 106, 0.09), transparent 42%),
        rgba(255, 255, 255, 0.012);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--orumi-gold);
      font-size: 0.83rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--orumi-gold);
      box-shadow: 0 0 16px rgba(214, 183, 106, 0.75);
    }

    .hero h2 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    .hero-question {
      margin: 0;
      color: var(--orumi-muted);
      font-size: clamp(1.08rem, 2vw, 1.35rem);
      max-width: 760px;
    }

    .lesson-stage {
      padding: clamp(20px, 3vw, 34px);
      display: grid;
      grid-template-columns: minmax(260px, 440px) 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .context-card {
  margin: clamp(20px, 3vw, 34px) clamp(20px, 3vw, 34px) 0;
  padding: clamp(20px, 3vw, 30px);
  border-radius: var(--radius-large);
  border: 1px solid rgba(214, 183, 106, 0.24);
  background:
    linear-gradient(135deg, rgba(214, 183, 106, 0.09), transparent 46%),
    rgba(255, 255, 255, 0.035);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
}

.context-card h3 {
  margin: 10px 0 12px;
  font-size: clamp(1.35rem, 2.4vw, 2rem);
  letter-spacing: -0.025em;
}

.context-card p {
  margin: 0 0 12px;
  color: var(--orumi-muted);
  max-width: 920px;
}

.context-card p:last-child {
  margin-bottom: 0;
}

.context-card .sound-places {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}

.context-card .sound-place {
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 7px 10px;
  color: var(--orumi-text);
  background: rgba(255, 255, 255, 0.045);
  font-size: 0.84rem;
}

    .sound-card,
    .visual-card,
    .reflection-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--orumi-border);
      border-radius: var(--radius-large);
      padding: 22px;
    }

    .sound-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 480px;
    }

    .root-zone {
      display: grid;
      place-items: center;
      min-height: 250px;
    }

    .orumi-block {
      width: min(180px, 46vw);
      height: min(180px, 46vw);
      border: none;
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.03)),
        var(--orumi-blue);
      color: white;
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.35),
        inset 0 2px 0 rgba(255, 255, 255, 0.25),
        inset 0 -12px 25px rgba(0, 0, 0, 0.18);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
      position: relative;
    }

    .orumi-block:hover {
      transform: translateY(-3px);
      filter: brightness(1.06);
    }

    .orumi-block:active,
    .orumi-block.playing {
      transform: translateY(2px) scale(0.98);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.38),
        0 0 38px rgba(90, 141, 238, 0.55),
        inset 0 2px 0 rgba(255, 255, 255, 0.25);
    }

    .orumi-block small {
      display: block;
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: 650;
      color: rgba(255, 255, 255, 0.76);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sound-copy h3,
    .visual-card h3,
    .reflection-card h3 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .sound-copy p,
    .visual-card p,
    .reflection-card p {
      margin: 0;
      color: var(--orumi-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--orumi-text);
      cursor: pointer;
      font-weight: 750;
      transition: 150ms ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, rgba(214, 183, 106, 0.95), rgba(231, 200, 95, 0.78));
      color: #17130a;
      border-color: rgba(214, 183, 106, 0.8);
    }

    .btn.ghost {
      background: transparent;
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      color: var(--orumi-muted);
      font-size: 0.9rem;
    }

    .switch-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--orumi-gold);
    }

    .visual-card {
      min-height: 480px;
      display: flex;
      flex-direction: column;
    }

    .tone-display {
      display: grid;
      grid-template-columns: repeat(8, minmax(46px, 1fr));
      gap: 10px;
      margin: 20px 0 22px;
    }

    .ghost-tone {
      min-height: 82px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--orumi-soft);
      opacity: 0.52;
      transform: translateY(6px);
      transition: 220ms ease;
      text-align: center;
      padding: 8px;
    }

    .ghost-tone.visible {
      opacity: 1;
      transform: translateY(0);
      border-style: solid;
      border-color: rgba(214, 183, 106, 0.38);
      background: rgba(214, 183, 106, 0.11);
      color: var(--orumi-text);
    }

    .ghost-tone.active {
      box-shadow: 0 0 26px rgba(214, 183, 106, 0.34);
      border-color: rgba(214, 183, 106, 0.82);
      background: rgba(214, 183, 106, 0.2);
    }

    .ghost-tone strong {
      font-size: 0.88rem;
    }

    .ghost-tone span {
      margin-top: 3px;
      font-size: 0.72rem;
      color: var(--orumi-muted);
    }

    .graph-wrap {
      flex: 1;
      min-height: 220px;
      display: flex;
      align-items: end;
      gap: 10px;
      padding: 22px 8px 8px;
      border-radius: var(--radius-medium);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018));
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
    }

    .bar-column {
      min-width: 62px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: end;
      gap: 8px;
    }

    .bar {
      width: 100%;
      max-width: 52px;
      height: 8px;
      border-radius: 12px 12px 5px 5px;
      background: rgba(255, 255, 255, 0.09);
      transition: height 400ms ease, background 220ms ease, box-shadow 220ms ease;
    }

    .bar.visible {
      background: linear-gradient(180deg, var(--orumi-gold), rgba(214, 183, 106, 0.34));
    }

    .bar.active {
      box-shadow: 0 0 22px rgba(214, 183, 106, 0.55);
      background: linear-gradient(180deg, #f1d989, var(--orumi-gold));
    }

    .bar-label {
      min-height: 38px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--orumi-muted);
      line-height: 1.15;
    }

    .current-tone {
      margin-top: 18px;
      padding: 16px;
      border-radius: var(--radius-medium);
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 112px;
    }

    .current-tone h4 {
      margin: 0 0 6px;
      color: var(--orumi-gold);
      font-size: 1rem;
    }

    .current-tone p {
      margin: 0;
      color: var(--orumi-muted);
    }

    .reflection-card {
      margin: 0 clamp(20px, 3vw, 34px) clamp(20px, 3vw, 34px);
      display: none;
    }

    .reflection-card.visible {
      display: block;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .choice-btn {
      min-height: 92px;
      border-radius: var(--radius-medium);
      border: 1px solid var(--orumi-border);
      color: var(--orumi-text);
      background: rgba(255, 255, 255, 0.045);
      cursor: pointer;
      padding: 14px;
      text-align: left;
      transition: 150ms ease;
    }

    .choice-btn:hover,
    .choice-btn.selected {
      background: var(--orumi-gold-soft);
      border-color: rgba(214, 183, 106, 0.55);
      transform: translateY(-2px);
    }

    .choice-btn strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .choice-btn span {
      color: var(--orumi-muted);
      font-size: 0.84rem;
    }

    .response-box {
      margin-top: 18px;
      border-radius: var(--radius-medium);
      background: rgba(103, 178, 111, 0.1);
      border: 1px solid rgba(103, 178, 111, 0.26);
      padding: 16px;
      color: var(--orumi-text);
      display: none;
    }

    .response-box.visible {
      display: block;
    }

    .next-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .placeholder-lesson {
      padding: clamp(22px, 4vw, 38px);
    }

    .placeholder-card {
      border: 1px solid var(--orumi-border);
      border-radius: var(--radius-large);
      background: rgba(255, 255, 255, 0.035);
      padding: 24px;
    }

    .placeholder-card h3 {
      margin: 0 0 8px;
      color: var(--orumi-gold);
    }

    .placeholder-card p {
      color: var(--orumi-muted);
      margin: 0 0 18px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .pill {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--orumi-muted);
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.82rem;
    }

    @media (max-width: 1040px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .lesson-stage {
        grid-template-columns: 1fr;
      }

      .choice-grid {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page-shell {
        padding: 14px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .tone-display {
        grid-template-columns: repeat(4, minmax(54px, 1fr));
      }

      .choice-grid {
        grid-template-columns: 1fr;
      }

      .sound-card,
      .visual-card,
      .reflection-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Return to Orumi home">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>Orumi</h1>
          <p>Interval Training · Sound as relationship</p>
        </div>
      </a>

      <div class="top-actions">
        <button class="btn ghost" id="resetProgressBtn">Reset progress</button>
        <button class="btn" id="saveProgressBtn">Save progress</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel sidebar" aria-label="Learning sessions">
        <div class="sidebar-header">
          <h2>Learning Path</h2>
          <p>Move through the lessons in order, or skip ahead when you are ready.</p>
        </div>

        <nav class="lesson-list" id="lessonList"></nav>

        <div class="progress-box">
          <div class="progress-label">
            <span>Saved progress</span>
            <span id="progressText">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <label class="switch-row">
            <input type="checkbox" id="autoAdvanceToggle" />
            <span>Auto-advance after each completed lesson</span>
          </label>
        </div>
      </aside>

      <section class="panel main-panel" id="mainPanel" aria-live="polite"></section>
    </main>
  </div>

  <script>
    const lessons = [
      {
        id: "hidden-life",
        number: 1,
        title: "The Hidden Life of One Note",
        subtitle: "Overtones and the first hidden chord",
        level: "Foundation",
        built: true
      },
      {
        id: "octave",
        number: 2,
        title: "The Octave",
        subtitle: "Sameness at another height",
        level: "Foundation",
        built: false
      },
      {
        id: "fifth",
        number: 3,
        title: "The Fifth",
        subtitle: "The first strong other",
        level: "Foundation",
        built: false
      },
      {
        id: "third",
        number: 4,
        title: "The Third",
        subtitle: "Brightness, tenderness, and color",
        level: "Intervals",
        built: false
      },
      {
        id: "tension",
        number: 5,
        title: "The Seventh and the Pull",
        subtitle: "Color, ache, and resolution",
        level: "Intervals",
        built: false
      },
      {
        id: "chord-birth",
        number: 6,
        title: "The Birth of Chords",
        subtitle: "Choosing which relationships to bring forward",
        level: "Chord Creation",
        built: false
      },
      {
        id: "resolution",
        number: 7,
        title: "Resolution",
        subtitle: "Where intervals want to go",
        level: "Motion",
        built: false
      },
      {
        id: "compose-feeling",
        number: 8,
        title: "Compose by Feeling",
        subtitle: "Build sound from emotional intention",
        level: "Creation",
        built: false
      }
    ];

    const overtones = [
      {
        number: 1,
        label: "Root",
        relationship: "Center",
        ratio: "1:1",
        frequency: 261.63,
        amplitude: 1,
        graphHeight: 185,
        description: "This is the note you named. It is the center of the sound."
      },
      {
        number: 2,
        label: "Octave",
        relationship: "Same note, higher",
        ratio: "2:1",
        frequency: 523.25,
        amplitude: 0.62,
        graphHeight: 148,
        description: "The octave sounds like the same note at a higher level. It feels like recognition."
      },
      {
        number: 3,
        label: "Fifth",
        relationship: "Strength and space",
        ratio: "3:2",
        frequency: 784.88,
        amplitude: 0.46,
        graphHeight: 116,
        description: "The fifth is the first strong other note. It feels open, stable, and spacious."
      },
      {
        number: 4,
        label: "Octave",
        relationship: "Root returns",
        ratio: "4:1",
        frequency: 1046.5,
        amplitude: 0.34,
        graphHeight: 93,
        description: "The root returns again. The note recognizes itself more strongly."
      },
      {
        number: 5,
        label: "Major Third",
        relationship: "Warmth and brightness",
        ratio: "5:4",
        frequency: 1308.15,
        amplitude: 0.27,
        graphHeight: 76,
        description: "The major third brings brightness. This tone helps create the sound of a major chord."
      },
      {
        number: 6,
        label: "Fifth",
        relationship: "Support deepens",
        ratio: "6:1",

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    function createSustainableVoice(ctx, frequency, startTime, duration, gainValue) {
  const output = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  filter.type = "lowpass";
  filter.frequency.setValueAtTime(2400, startTime);
  filter.Q.setValueAtTime(0.75, startTime);

  output.gain.setValueAtTime(0.0001, startTime);
  output.gain.exponentialRampToValueAtTime(gainValue, startTime + 0.18);
  output.gain.setValueAtTime(gainValue, startTime + Math.max(0.2, duration - 0.9));
  output.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

  const vibrato = ctx.createOscillator();
  const vibratoGain = ctx.createGain();

  vibrato.type = "sine";
  vibrato.frequency.setValueAtTime(4.8, startTime);
  vibratoGain.gain.setValueAtTime(frequency * 0.0025, startTime);

  const sine = ctx.createOscillator();
  const triangle = ctx.createOscillator();

  const sineGain = ctx.createGain();
  const triangleGain = ctx.createGain();

  sine.type = "sine";
  triangle.type = "triangle";

  sine.frequency.setValueAtTime(frequency, startTime);
  triangle.frequency.setValueAtTime(frequency, startTime);

  sineGain.gain.setValueAtTime(0.82, startTime);
  triangleGain.gain.setValueAtTime(0.18, startTime);

  vibrato.connect(vibratoGain);
  vibratoGain.connect(sine.frequency);
  vibratoGain.connect(triangle.frequency);

  sine.connect(sineGain);
  triangle.connect(triangleGain);

  sineGain.connect(filter);
  triangleGain.connect(filter);
  filter.connect(output);

  sine.start(startTime);
  triangle.start(startTime);
  vibrato.start(startTime);

  sine.stop(startTime + duration + 0.1);
  triangle.stop(startTime + duration + 0.1);
  vibrato.stop(startTime + duration + 0.1);

  return output;
}

function playRootWithSoftOvertones() {
  const ctx = getAudioContext();

  if (ctx.state === "suspended") {
    ctx.resume();
  }

  const now = ctx.currentTime;
  const masterGain = ctx.createGain();

  masterGain.gain.setValueAtTime(0.82, now);
  masterGain.connect(ctx.destination);

  overtones.slice(0, 5).forEach((tone, index) => {
    const duration = 2.1;
    const gain = index === 0 ? 0.16 : 0.035 / (index + 1);
    const voice = createSustainableVoice(ctx, tone.frequency, now, duration, gain);
    voice.connect(masterGain);
  });

  const block = document.getElementById("rootBlock");
  if (block) {
    block.classList.add("playing");
    setTimeout(() => block.classList.remove("playing"), 1200);
  }
}

    async function playOvertoneSequence() {
  if (isPlayingSequence) return;

  isPlayingSequence = true;

  const ctx = getAudioContext();

  if (ctx.state === "suspended") {
    await ctx.resume();
  }

  const revealBtn = document.getElementById("revealBtn");
  const lingerToggle = document.getElementById("lingerToggle");

  const stepDelay = lingerToggle && lingerToggle.checked ? 1300 : 850;
  const totalDuration = (overtones.length * stepDelay) / 1000 + 3.5;
  const startTime = ctx.currentTime + 0.08;

  const masterGain = ctx.createGain();
  const compressor = ctx.createDynamicsCompressor();

  masterGain.gain.setValueAtTime(0.72, startTime);

  compressor.threshold.setValueAtTime(-18, startTime);
  compressor.knee.setValueAtTime(18, startTime);
  compressor.ratio.setValueAtTime(4, startTime);
  compressor.attack.setValueAtTime(0.02, startTime);
  compressor.release.setValueAtTime(0.35, startTime);

  masterGain.connect(compressor);
  compressor.connect(ctx.destination);

  if (revealBtn) {
    revealBtn.disabled = true;
    revealBtn.textContent = "Blooming…";
  }

  clearOvertoneReveal();

  overtones.forEach((tone, index) => {
    const toneStart = startTime + (index * stepDelay) / 1000;
    const remainingDuration = Math.max(2.2, totalDuration - (index * stepDelay) / 1000);

    const baseGain = 0.15;
    const overtoneGain = baseGain * tone.amplitude * Math.pow(0.82, index);

    const voice = createSustainableVoice(
      ctx,
      tone.frequency,
      toneStart,
      remainingDuration,
      Math.max(0.012, overtoneGain)
    );

    voice.connect(masterGain);

    setTimeout(() => {
      revealedToneIndex = index;
      revealTone(index);
    }, index * stepDelay);
  });

  setTimeout(() => {
    showFullOvertoneBloom();
  }, overtones.length * stepDelay + 400);

  setTimeout(() => {
    showReflection();
    isPlayingSequence = false;

    if (revealBtn) {
      revealBtn.disabled = false;
      revealBtn.textContent = "Bloom again";
    }
  }, totalDuration * 1000);
}

    function revealTone(index) {
      const tone = overtones[index];

      overtones.forEach((_, i) => {
        document.getElementById(`ghostTone-${i}`)?.classList.remove("active");
        document.getElementById(`bar-${i}`)?.classList.remove("active");
      });

      const ghost = document.getElementById(`ghostTone-${index}`);
      const bar = document.getElementById(`bar-${index}`);
      const currentTone = document.getElementById("currentTone");

      if (ghost) {
        ghost.classList.add("visible", "active");
      }

      if (bar) {
        bar.classList.add("visible", "active");
        bar.style.height = `${tone.graphHeight}px`;
      }

      if (currentTone) {
        currentTone.innerHTML = `
          <h4>${tone.number}. ${tone.label} · ${tone.ratio}</h4>
          <p>${tone.description}</p>
        `;
      }
    }

    function clearOvertoneReveal() {
      revealedToneIndex = -1;

      overtones.forEach((tone, index) => {
        const ghost = document.getElementById(`ghostTone-${index}`);
        const bar = document.getElementById(`bar-${index}`);

        if (ghost) {
          ghost.classList.remove("visible", "active");
        }

        if (bar) {
          bar.classList.remove("visible", "active");
          bar.style.height = "8px";
        }
      });

      const currentTone = document.getElementById("currentTone");
      const reflectionCard = document.getElementById("reflectionCard");
      const responseBox = document.getElementById("responseBox");

      if (currentTone) {
        currentTone.innerHTML = `
          <h4>Ready</h4>
          <p>Press “Reveal hidden tones” to hear and see the hidden structure of the note.</p>
        `;
      }

      if (reflectionCard) {
        reflectionCard.classList.remove("visible");
      }

      if (responseBox) {
        responseBox.classList.remove("visible");
        responseBox.innerHTML = "";
      }

      document.querySelectorAll(".choice-btn").forEach((button) => {
        button.classList.remove("selected");
      });
    }

    function restoreVisibleOvertones() {
      if (revealedToneIndex < 0) return;

      for (let i = 0; i <= revealedToneIndex; i++) {
        const tone = overtones[i];
        const ghost = document.getElementById(`ghostTone-${i}`);
        const bar = document.getElementById(`bar-${i}`);

        if (ghost) {
          ghost.classList.add("visible");
        }

        if (bar) {
          bar.classList.add("visible");
          bar.style.height = `${tone.graphHeight}px`;
        }
      }
    }


    function showFullOvertoneBloom() {
  overtones.forEach((tone, index) => {
    const ghost = document.getElementById(`ghostTone-${index}`);
    const bar = document.getElementById(`bar-${index}`);

    if (ghost) {
      ghost.classList.add("visible");
      ghost.classList.remove("active");
    }

    if (bar) {
      bar.classList.add("visible");
      bar.classList.remove("active");
      bar.style.height = `${tone.graphHeight}px`;
    }
  });

  const currentTone = document.getElementById("currentTone");

  if (currentTone) {
    currentTone.innerHTML = `
      <h4>The hidden chord is blooming</h4>
      <p>
        Each tone entered one at a time, but the earlier tones remained softly present.
        This lets you hear the note not as a single point, but as a living stack of relationships.
      </p>
    `;
  }
}

    function showReflection() {
      const reflectionCard = document.getElementById("reflectionCard");
      if (reflectionCard) {
        reflectionCard.classList.add("visible");
        reflectionCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function handleReflectionChoice(button) {
      const choice = button.dataset.choice;
      const responseBox = document.getElementById("responseBox");

      document.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");

      const responses = {
        octave: "Yes. The octave feels like sameness at another height. It is recognition, return, and identity.",
        fifth: "Yes. The fifth is one of the strongest relationships in sound. It often feels open, stable, spacious, and foundational.",
        third: "The third adds emotional color. It begins to make the sound feel bright, warm, human, or tender.",
        seventh: "The seventh-like overtone adds color and tension. It does not simply rest; it begins to want movement."
      };

      responseBox.innerHTML = `
        <strong>Good noticing.</strong>
        <p style="margin: 6px 0 0; color: var(--orumi-muted);">${responses[choice]}</p>
      `;

      responseBox.classList.add("visible");
    }

    function completeCurrentLesson() {
      const lesson = lessons[currentLessonIndex];
      completedLessonIds.add(lesson.id);
      saveProgress();
      renderLessonList();
      updateProgressUI();

      if (autoAdvanceToggle.checked && currentLessonIndex < lessons.length - 1) {
        currentLessonIndex += 1;
        revealedToneIndex = -1;
        renderLessonList();
        renderCurrentLesson();
        saveProgress();
      }
    }

    function saveProgress() {
      const data = {
        currentLessonIndex,
        completedLessonIds: Array.from(completedLessonIds),
        autoAdvance: autoAdvanceToggle.checked
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      updateProgressUI();

      saveProgressBtn.textContent = "Saved";
      setTimeout(() => {
        saveProgressBtn.textContent = "Save progress";
      }, 900);
    }

    function loadProgress() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;

      try {
        const data = JSON.parse(raw);

        currentLessonIndex = Number.isInteger(data.currentLessonIndex)
          ? Math.min(Math.max(data.currentLessonIndex, 0), lessons.length - 1)
          : 0;

        completedLessonIds = new Set(Array.isArray(data.completedLessonIds) ? data.completedLessonIds : []);
        autoAdvanceToggle.checked = Boolean(data.autoAdvance);
      } catch (error) {
        console.warn("Could not load Orumi interval progress.", error);
      }
    }

    function resetProgress() {
      localStorage.removeItem(STORAGE_KEY);
      currentLessonIndex = 0;
      completedLessonIds = new Set();
      revealedToneIndex = -1;
      autoAdvanceToggle.checked = false;
      renderLessonList();
      renderCurrentLesson();
      updateProgressUI();
    }

    function updateProgressUI() {
      const percent = Math.round((completedLessonIds.size / lessons.length) * 100);
      progressFill.style.width = `${percent}%`;
      progressText.textContent = `${percent}%`;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    init();
  </script>
