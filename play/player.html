<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orumi Note Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/orumi-catalog.js"></script>
  <script src="js/voices.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 80px;
      box-sizing: border-box;
      user-select: none;
    }

    h1 {
      margin: 14px 0 6px;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      color: #bdb4a6;
      margin-bottom: 16px;
      font-size: 14px;
      text-align: center;
      line-height: 1.35;
      max-width: 760px;
    }

    .top-button {
      position: fixed;
      top: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      text-decoration: none;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: #222;
      background: rgba(255,255,255,0.86);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      z-index: 1000;
      transition: 0.12s;
    }

    .top-button:hover,
    .top-button:active {
      transform: scale(0.94);
      filter: brightness(1.08);
    }

    .back-button { left: 18px; }
    .chord-button { right: 18px; }

    .start-audio-button {
      border: none;
      border-radius: 999px;
      padding: 13px 22px;
      margin: 8px 0 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .start-audio-button.ready {
      background: rgba(255,255,255,0.16);
      color: #fff7ea;
      cursor: default;
    }

    .start-audio-button:disabled {
      opacity: 0.82;
    }

    .player {
      width: min(94vmin, 900px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section {
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ddd;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .system-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .voice-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .family-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .mode-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .octave-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .note-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-octave-row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
    }

    .square {
      border: none;
      border-radius: 16px;
      min-height: 56px;
      font-size: clamp(12px, 2.3vmin, 17px);
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: 0.12s;
      text-align: center;
      padding: 6px;
      line-height: 1.15;
    }

    .note-square {
      min-height: 46px;
      border-radius: 12px;
      font-size: clamp(10px, 1.7vmin, 14px);
      padding: 3px;
    }

    .square:hover,
    .square:active {
      transform: scale(0.96);
      filter: brightness(1.12);
    }

    .square.selected,
    .square.highlighted {
      outline: 4px solid rgba(255,255,255,1);
      outline-offset: -4px;
      filter: brightness(1.45);
      box-shadow:
        0 0 36px rgba(255,255,255,0.95),
        0 0 18px rgba(255,230,150,0.85),
        0 6px 14px rgba(0,0,0,0.35);
    }

    .control-square {
      background: #38444a;
    }

    .status {
      text-align: center;
      color: #bdb4a6;
      font-size: 13px;
      line-height: 1.4;
      min-height: 18px;
      margin-top: -6px;
      margin-bottom: 4px;
    }

    .highlight-label {
      color: #d8d0c4;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      margin-top: 4px;
    }

    .action-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .action-button,
    .action-link {
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      text-align: center;
      text-decoration: none;
      font-family: inherit;
    }

    .secondary-button {
      background: rgba(255,255,255,0.16);
      color: #fff7ea;
    }

    .c  { background: #ff6b6b; }
    .db { background: linear-gradient(135deg, #ff6b6b, #f7b267); }
    .d  { background: #f7b267; }
    .eb { background: linear-gradient(135deg, #f7b267, #ffd93d); color: #222; }
    .e  { background: #ffd93d; color: #222; }
    .f  { background: #6bcb77; }
    .gb { background: linear-gradient(135deg, #6bcb77, #4d96ff); }
    .g  { background: #4d96ff; }
    .ab { background: linear-gradient(135deg, #4d96ff, #9d4edd); }
    .a  { background: #9d4edd; }
    .bb { background: linear-gradient(135deg, #9d4edd, #ff8fab); }
    .b  { background: #ff8fab; }

    @media (max-width: 760px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        margin-top: 72px;
      }

      .system-grid,
      .voice-grid,
      .family-grid,
      .mode-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .note-octave-row {
        grid-template-columns: repeat(6, 1fr);
      }

      .action-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <a
    class="top-button back-button"
    href="index.html"
    title="Return to Home Screen"
  >←</a>

  <a
    class="top-button chord-button"
    id="chordFactoryButton"
    href="chord-factory.html"
    title="Open Chord Factory"
  >＋</a>

  <h1>Orumi Player</h1>

  <div class="subtitle">
    Choose a sound system, voice, key center, and note set.
    Press Begin Sound first, then play the colored note squares.
  </div>

  <button id="startAudioButton" class="start-audio-button">
    Begin Sound
  </button>

  <div class="status" id="audioStatus">
    Sound is waiting to begin.
  </div>

  <div class="player">

    <div class="section">
      <div class="section-title">Sound System</div>
      <div class="grid system-grid" id="systemGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Voice</div>
      <div class="grid voice-grid" id="voiceGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Key Center</div>
      <div class="grid note-octave-row" id="rootGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Note Family</div>
      <div class="grid family-grid" id="familyGrid"></div>
    </div>

    <div class="section" id="modeSection">
      <div class="section-title">Mode / Scale</div>
      <div class="grid mode-grid" id="modeGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Octaves</div>
      <div class="grid octave-grid" id="octaveGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Playable Notes</div>
      <div class="highlight-label" id="highlightLabel"></div>
      <div class="note-grid" id="noteGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Tools</div>
      <div class="action-row">
        <a
          class="action-link"
          id="openChordFactoryButton"
          href="chord-factory.html"
        >
          Open Chord Factory
        </a>

        <a
          class="action-link secondary-button"
          href="progression-builder.html"
        >
          Open Progression Builder
        </a>
      </div>
    </div>

  </div>

  <script>
    let audioContext;
    let audioReady = false;
    let activeNotes = [];

    const params =
      new URLSearchParams(window.location.search);

    const pitchClasses =
      ORUMI_CATALOG.pitchClasses;

    const numberToPitchClass =
      ORUMI_CATALOG.numberToPitchClass;

    const systems =
      ORUMI_CATALOG.systems;

    const voices =
      ORUMI_CATALOG.voices;

    const systemGrid =
      document.getElementById("systemGrid");

    const voiceGrid =
      document.getElementById("voiceGrid");

    const rootGrid =
      document.getElementById("rootGrid");

    const familyGrid =
      document.getElementById("familyGrid");

    const modeGrid =
      document.getElementById("modeGrid");

    const modeSection =
      document.getElementById("modeSection");

    const octaveGrid =
      document.getElementById("octaveGrid");

    const noteGrid =
      document.getElementById("noteGrid");

    const highlightLabel =
      document.getElementById("highlightLabel");

    const startAudioButton =
      document.getElementById("startAudioButton");

    const audioStatus =
      document.getElementById("audioStatus");

    const chordFactoryButton =
      document.getElementById("chordFactoryButton");

    const openChordFactoryButton =
      document.getElementById("openChordFactoryButton");

    let selectedSystemKey =
      params.get("system") || "western";

    if (!systems[selectedSystemKey]) {
      selectedSystemKey = "western";
    }

    let selectedSystem =
      systems[selectedSystemKey];

    let selectedVoice =
      params.get("voice") ||
      selectedSystem.defaultVoice ||
      "softKeys";

    if (!voices[selectedVoice]) {
      selectedVoice =
        selectedSystem.defaultVoice || "softKeys";
    }

    let selectedRoot =
      params.get("root") ||
      selectedSystem.defaultRoot ||
      "C";

    if (!pitchClasses[selectedRoot]) {
      selectedRoot = "C";
    }

    let selectedFamily =
      params.get("family") ||
      selectedSystem.defaultFamily ||
      "diatonic";

    let selectedMode =
      params.get("scaleMode") ||
      selectedSystem.defaultMode ||
      "ionian";

    let selectedOctaves =
      parseOctaves(params.get("octaves") || "3,4");

    let highlightedNotes =
      parseHighlight(params.get("highlight"));

    function parseOctaves(value) {
      const parsed =
        String(value)
          .split(",")
          .map(item => parseInt(item.trim(), 10))
          .filter(item => Number.isInteger(item));

      const valid =
        parsed.filter(item => [2,3,4,5].includes(item));

      return valid.length > 0
        ? [...new Set(valid)].sort((a,b) => a - b)
        : [3,4];
    }

    function parseHighlight(value) {
      if (!value) {
        return [];
      }

      return String(value)
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);
    }

    function midiToFrequency(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function pcToName(pcNumber) {
      return numberToPitchClass[
        ((pcNumber % 12) + 12) % 12
      ];
    }

    function noteNameToMidi(noteName) {
      const match =
        String(noteName).match(/^([A-G][b]?)(-?\d+)$/);

      if (!match) return null;

      const pc = match[1];
      const octave = parseInt(match[2], 10);

      if (!pitchClasses[pc]) return null;

      return 12 * (octave + 1) +
        pitchClasses[pc].number;
    }

    function midiToDisplayName(midi) {
      const pcName =
        pcToName(midi % 12);

      const octave =
        Math.floor(midi / 12) - 1;

      return pcName + octave;
    }

    function getChromaticFromRoot(rootName) {
      const rootNumber =
        pitchClasses[rootName].number;

      const result = [];

      for (let i = 0; i < 12; i++) {
        result.push(pcToName(rootNumber + i));
      }

      return result;
    }

    function getCurrentFamilies() {
      const families =
        selectedSystem.families || {};

      return families;
    }

    function getCurrentModes() {
      const family =
        getCurrentFamilies()[selectedFamily];

      if (!family || !family.modes) {
        return {};
      }

      return family.modes;
    }

    function getScaleIntervals() {
      const families =
        getCurrentFamilies();

      const family =
        families[selectedFamily];

      if (!family) {
        return Array.from({ length: 12 }, (_, i) => i);
      }

      if (
        family.intervals &&
        Array.isArray(family.intervals)
      ) {
        return family.intervals;
      }

      const modes =
        family.modes || {};

      const mode =
        modes[selectedMode];

      if (
        mode &&
        Array.isArray(mode.intervals)
      ) {
        return mode.intervals;
      }

      return Array.from({ length: 12 }, (_, i) => i);
    }

    function buildPlayableNotes() {
      const rootNumber =
        pitchClasses[selectedRoot].number;

      const intervals =
        getScaleIntervals();

      const notes = [];

      selectedOctaves.forEach(octave => {
        intervals.forEach(interval => {
          const midi =
            12 * (octave + 1) +
            rootNumber +
            interval;

          const pitchName =
            pcToName(midi % 12);

          const pitch =
            pitchClasses[pitchName];

          notes.push({
            midi,
            frequency: midiToFrequency(midi),
            pitchName,
            octave: Math.floor(midi / 12) - 1,
            displayName: midiToDisplayName(midi),
            display:
              pitch ? pitch.display : pitchName,
            className:
              pitch ? pitch.className : "c"
          });
        });
      });

      return notes.sort((a,b) => a.midi - b.midi);
    }

    async function ensureAudio() {
      if (!audioContext) {
        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      audioReady = true;

      startAudioButton.textContent = "Sound Ready";
      startAudioButton.disabled = true;
      startAudioButton.classList.add("ready");

      audioStatus.textContent =
        "Sound is ready. Play the colored squares.";
    }

    function stopActiveNotes() {
      if (!audioContext) {
        activeNotes = [];
        return;
      }

      activeNotes.forEach(note => {
        ORUMI_VOICES.stopVoice(
          note,
          audioContext,
          0.12
        );
      });

      activeNotes = [];
    }

    async function playNote(note) {
      if (!audioReady) {
        audioStatus.textContent =
          "Press Begin Sound first.";
        return;
      }

      await ensureAudio();

      stopActiveNotes();

      const now =
        audioContext.currentTime;

      const voiceNode =
        ORUMI_VOICES.buildVoice(
          audioContext,
          selectedVoice,
          note.frequency,
          now
        );

      activeNotes = [{
        voice: selectedVoice,
        gain: voiceNode.gain,
        oscillators:
          voiceNode.oscillators || [],
        noiseSources:
          voiceNode.noiseSources || []
      }];

      audioStatus.textContent =
        "Playing " + note.displayName;

      setTimeout(() => {
        stopActiveNotes();
      }, 950);
    }

    function updateChordFactoryLinks() {
      const base =
        "chord-factory.html" +
        "?system=" +
        encodeURIComponent(selectedSystemKey) +
        "&root=" +
        encodeURIComponent(selectedRoot) +
        "&family=" +
        encodeURIComponent(selectedFamily) +
        "&scaleMode=" +
        encodeURIComponent(selectedMode) +
        "&octaves=" +
        encodeURIComponent(selectedOctaves.join(",")) +
        "&voice=" +
        encodeURIComponent(selectedVoice);

      chordFactoryButton.href = base;
      openChordFactoryButton.href = base;
    }

    function buildSystemGrid() {
      systemGrid.innerHTML = "";

      Object.entries(systems).forEach(([key, system]) => {
        const button =
          document.createElement("button");

        button.classList.add(
          "square",
          "control-square"
        );

        if (key === selectedSystemKey) {
          button.classList.add("selected");
        }

        button.textContent =
          system.label || key;

        button.addEventListener("click", () => {
          selectedSystemKey = key;
          selectedSystem = systems[selectedSystemKey];

          selectedVoice =
            selectedSystem.defaultVoice ||
            selectedVoice;

          if (!voices[selectedVoice]) {
            selectedVoice = "softKeys";
          }

          selectedRoot =
            selectedSystem.defaultRoot ||
            selectedRoot;

          if (!pitchClasses[selectedRoot]) {
            selectedRoot = "C";
          }

          selectedFamily =
            selectedSystem.defaultFamily ||
            Object.keys(selectedSystem.families || {})[0] ||
            "diatonic";

          selectedMode =
            selectedSystem.defaultMode ||
            Object.keys(getCurrentModes())[0] ||
            "ionian";

          buildAll();
        });

        systemGrid.appendChild(button);
      });
    }

    function buildVoiceGrid() {
      voiceGrid.innerHTML = "";

      Object.entries(voices).forEach(([key, voice]) => {
        const button =
          document.createElement("button");

        button.classList.add(
          "square",
          "control-square"
        );

        if (key === selectedVoice) {
          button.classList.add("selected");
        }

        button.textContent =
          voice.label || key;

        button.addEventListener("click", () => {
          selectedVoice = key;
          buildAll();
        });

        voiceGrid.appendChild(button);
      });
    }

    function buildRootGrid() {
      rootGrid.innerHTML = "";

      const roots =
        getChromaticFromRoot(selectedRoot);

      roots.forEach(key => {
        const pitch =
          pitchClasses[key];

        const button =
          document.createElement("button");

        button.classList.add(
          "square",
          "note-square",
          pitch.className
        );

        if (key === selectedRoot) {
          button.classList.add("selected");
        }

        button.textContent =
          pitch.display;

        button.addEventListener("click", () => {
          selectedRoot = key;
          buildAll();
        });

        rootGrid.appendChild(button);
      });
    }

    function buildFamilyGrid() {
      familyGrid.innerHTML = "";

      const families =
        getCurrentFamilies();

      const entries =
        Object.entries(families);

      if (entries.length === 0) {
        const button =
          document.createElement("button");

        button.classList.add(
          "square",
          "control-square",
          "selected"
        );

        button.textContent = "Full";
        familyGrid.appendChild(button);
        return;
      }

      if (!families[selectedFamily]) {
        selectedFamily = entries[0][0];
      }

      entries.forEach(([key, family]) => {
        const button =
          document.createElement("button");

        button.classList.add(
          "square",
          "control-square"
        );

        if (key === selectedFamily) {
          button.classList.add("selected");
        }

        button.textContent =
          family.label || key;

        button.addEventListener("click", () => {
          selectedFamily = key;

          const modes =
            getCurrentModes();

          selectedMode =
            Object.keys(modes)[0] ||
            selectedMode;

          buildAll();
        });

        familyGrid.appendChild(button);
      });
    }

    function buildModeGrid() {
      modeGrid.innerHTML = "";

      const modes =
        getCurrentModes();

      const entries =
        Object.entries(modes);

      if (entries.length === 0) {
        modeSection.style.display = "none";
        return;
      }

      modeSection.style.display = "block";

      if (!modes[selectedMode]) {
        selectedMode = entries[0][0];
      }

      entries.forEach(([key, mode]) => {
        const button =
          document.createElement("button");

        button.classList.add(
          "square",
          "control-square"
        );

        if (key === selectedMode) {
          button.classList.add("selected");
        }

        button.textContent =
          mode.label || key;

        button.addEventListener("click", () => {
          selectedMode = key;
          buildAll();
        });

        modeGrid.appendChild(button);
      });
    }

    function buildOctaveGrid() {
      octaveGrid.innerHTML = "";

      [2,3,4,5].forEach(octave => {
        const button =
          document.createElement("button");

        button.classList.add(
          "square",
          "control-square"
        );

        if (selectedOctaves.includes(octave)) {
          button.classList.add("selected");
        }

        button.textContent =
          "Octave " + octave;

        button.addEventListener("click", () => {
          if (selectedOctaves.includes(octave)) {
            if (selectedOctaves.length > 1) {
              selectedOctaves =
                selectedOctaves.filter(
                  item => item !== octave
                );
            }
          } else {
            selectedOctaves.push(octave);
          }

          selectedOctaves =
            [...new Set(selectedOctaves)]
              .sort((a,b) => a - b);

          buildAll();
        });

        octaveGrid.appendChild(button);
      });
    }

    function buildNoteGrid() {
      noteGrid.innerHTML = "";

      const notes =
        buildPlayableNotes();

      const notesByOctave = {};

      notes.forEach(note => {
        if (!notesByOctave[note.octave]) {
          notesByOctave[note.octave] = [];
        }

        notesByOctave[note.octave].push(note);
      });

      Object.keys(notesByOctave)
        .map(value => parseInt(value, 10))
        .sort((a,b) => a - b)
        .forEach(octave => {
          const row =
            document.createElement("div");

          row.classList.add("note-octave-row");

          notesByOctave[octave].forEach(note => {
            const button =
              document.createElement("button");

            button.classList.add(
              "square",
              "note-square",
              note.className
            );

            if (
              highlightedNotes.includes(
                note.displayName
              )
            ) {
              button.classList.add("highlighted");
            }

            button.textContent =
              note.displayName;

            button.addEventListener("click", () => {
              playNote(note);
            });

            row.appendChild(button);
          });

          noteGrid.appendChild(row);
        });

      if (highlightedNotes.length > 0) {
        highlightLabel.textContent =
          "Highlighted: " +
          highlightedNotes.join(" · ");
      } else {
        highlightLabel.textContent = "";
      }
    }

    function buildAll() {
      buildSystemGrid();
      buildVoiceGrid();
      buildRootGrid();
      buildFamilyGrid();
      buildModeGrid();
      buildOctaveGrid();
      buildNoteGrid();
      updateChordFactoryLinks();
    }

    startAudioButton.addEventListener(
      "click",
      async () => {
        await ensureAudio();
      }
    );

    window.addEventListener(
      "beforeunload",
      stopActiveNotes
    );

    buildAll();
  </script>

</body>
</html>
