<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orumi Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/orumi-catalog.js"></script>
  <script src="js/voices.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 90px;
      box-sizing: border-box;
      user-select: none;
    }

    h1 {
      margin: 14px 0 6px;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      color: #bdb4a6;
      margin-bottom: 18px;
      font-size: 14px;
      text-align: center;
      line-height: 1.35;
      max-width: 780px;
    }

    .top-button {
      position: fixed;
      top: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      text-decoration: none;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: #222;
      background: rgba(255,255,255,0.86);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      z-index: 1000;
      transition: 0.12s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .top-button:hover,
    .top-button:active {
      transform: scale(0.94);
      filter: brightness(1.08);
    }

    .logo-button {
      left: 18px;
      width: 58px;
      height: 58px;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
    }

    .logo-button:hover,
    .logo-button:active {
      background: transparent;
      box-shadow: none;
      filter: brightness(1.12);
    }

    .logo-button img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 0;
    }

    .back-button { left: 88px; }
    .home-button { right: 18px; }
    .selection-button { right: 76px; }
    .chord-button { right: 134px; }
    .design-button { right: 192px; }

    .player {
      width: min(96vw, 1060px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section {
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ddd;
    }

    .info-line {
      color: #d8d0c4;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      margin: 4px 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .control-button,
    .control-link {
      border: none;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      text-align: center;
      text-decoration: none;
      font-family: inherit;
    }

    .control-button.secondary,
    .control-link.secondary {
      background: rgba(255,255,255,0.16);
      color: #fff7ea;
    }

    .control-button.danger {
      background: rgba(255,90,90,0.22);
      color: #ffe5e5;
    }

    .control-button.recording {
      background: rgba(255,80,80,0.88);
      color: #111;
    }

    .control-button.ready {
      background: rgba(155,235,215,0.92);
      color: #102522;
    }

    .control-button.drone.active {
      background: rgba(255,230,150,0.92);
      color: #111;
    }

    .status {
      color: #bdb4a6;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      min-height: 18px;
      margin-top: 10px;
    }

    .note-grid {
      display: grid;
      gap: 10px;
    }

    .octave-row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .note-button {
      border: none;
      border-radius: 16px;
      min-height: 64px;
      color: white;
      font-size: clamp(11px, 2.1vmin, 17px);
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 7px 16px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.22);
      transition: 0.1s;
      text-align: center;
      padding: 6px;
      line-height: 1.1;
      font-family: inherit;
      touch-action: none;
    }

    .note-button:hover,
    .note-button:active,
    .note-button.playing {
      transform: scale(0.94);
      filter: brightness(1.35);
      box-shadow:
        0 0 28px rgba(255,255,255,0.65),
        0 7px 16px rgba(0,0,0,0.38);
    }

    .note-button.highlighted {
      outline: 4px solid rgba(255,255,255,0.95);
      outline-offset: -4px;
      filter: brightness(1.35);
    }

    .note-button.outside {
      filter: brightness(0.65) saturate(0.75);
      opacity: 0.82;
    }

    .note-button.native {
      box-shadow:
        0 0 16px rgba(255,255,255,0.28),
        0 7px 16px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.22);
    }

    .note-label {
      display: block;
      font-size: 1em;
    }

    .note-sub {
      display: block;
      font-size: 0.72em;
      opacity: 0.82;
      margin-top: 3px;
    }

    .c  { background: #ff6b6b; }
    .db { background: linear-gradient(135deg, #ff6b6b, #f7b267); }
    .d  { background: #f7b267; }
    .eb { background: linear-gradient(135deg, #f7b267, #ffd93d); color: #222; }
    .e  { background: #ffd93d; color: #222; }
    .f  { background: #6bcb77; }
    .gb { background: linear-gradient(135deg, #6bcb77, #4d96ff); }
    .g  { background: #4d96ff; }
    .ab { background: linear-gradient(135deg, #4d96ff, #9d4edd); }
    .a  { background: #9d4edd; }
    .bb { background: linear-gradient(135deg, #9d4edd, #ff8fab); }
    .b  { background: #ff8fab; }

    @media (max-width: 760px) {
      h1 {
        margin-top: 82px;
      }

      .logo-button {
        width: 52px;
        height: 52px;
      }

      .logo-button img {
        width: 52px;
        height: 52px;
      }

      .back-button { left: 80px; }

      .top-button {
        width: 42px;
        height: 42px;
        font-size: 22px;
      }

      .home-button { right: 18px; }
      .selection-button { right: 69px; }
      .chord-button { right: 120px; }
      .design-button { right: 171px; }

      .octave-row {
        grid-template-columns: repeat(6, 1fr);
      }

      .note-button {
        min-height: 54px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

  <a
    class="top-button logo-button"
    href="../index.html"
    title="Orumi Home"
  >
    <img src="../assets/orumi-black.png" alt="Orumi" />
  </a>

  <button
    class="top-button back-button"
    id="backButton"
    title="Go Back"
  >←</button>

  <a
    class="top-button home-button"
    href="index.html"
    title="Orumi Play Home"
  >⌂</a>

  <a
    class="top-button selection-button"
    id="selectionLink"
    href="selection-control.html"
    title="Selection Control"
  >⚙</a>

  <a
    class="top-button chord-button"
    id="chordFactoryLink"
    href="chord-factory.html"
    title="Open Chord Factory"
  >⊞</a>

  <a
    class="top-button design-button"
    id="designStudioTopLink"
    href="design-studio.html"
    title="Open Design Studio"
  >DS</a>

  <h1 id="pageTitle">Orumi Player</h1>

  <div class="subtitle" id="subtitle">
    Press Begin Sound, then play Orumi sound squares.
  </div>

  <div class="player">

    <div class="section">
      <div class="section-title">Sound & Recording</div>

      <div class="controls">
        <button
          class="control-button"
          id="beginSoundButton"
        >
          Begin Sound
        </button>

        <button
          class="control-button secondary"
          id="recordButton"
        >
          Start Recording
        </button>

        <button
          class="control-button secondary"
          id="clearTakeButton"
        >
          Clear Take
        </button>

        <a
          class="control-link"
          id="designStudioLink"
          href="design-studio.html"
        >
          Open Design Studio
        </a>

        <a
          class="control-link secondary"
          id="progressionLink"
          href="progression-builder.html"
        >
          Open Progression
        </a>

        <button
          class="control-button secondary drone"
          id="droneButton"
        >
          Start Drone
        </button>
      </div>

      <div class="status" id="status">
        Sound is not started yet.
      </div>

      <div class="status" id="recordingStatus">
        No active recording.
      </div>

      <div class="status" id="droneStatus"></div>
    </div>

    <div class="section">
      <div class="section-title">Current Selection</div>
      <div class="info-line" id="selectionSummary"></div>
      <div class="info-line" id="highlightSummary"></div>
    </div>

    <div class="section">
      <div class="section-title">Sound Squares</div>
      <div class="note-grid" id="noteGrid"></div>
    </div>

  </div>

  <script>
    let audioContext;
    let soundReady = false;
    let activeNotes = new Map();
    let droneNotes = [];
    let droneActive = false;

    let isRecording = false;
    let recordingStartTime = 0;
    let currentRecording = [];
    let activeRecordingNotes = new Map();

    const backButton =
      document.getElementById("backButton");

    const pageTitle =
      document.getElementById("pageTitle");

    const subtitle =
      document.getElementById("subtitle");

    const noteGrid =
      document.getElementById("noteGrid");

    const selectionSummary =
      document.getElementById("selectionSummary");

    const highlightSummary =
      document.getElementById("highlightSummary");

    const beginSoundButton =
      document.getElementById("beginSoundButton");

    const recordButton =
      document.getElementById("recordButton");

    const clearTakeButton =
      document.getElementById("clearTakeButton");

    const droneButton =
      document.getElementById("droneButton");

    const status =
      document.getElementById("status");

    const recordingStatus =
      document.getElementById("recordingStatus");

    const droneStatus =
      document.getElementById("droneStatus");

    const selectionLink =
      document.getElementById("selectionLink");

    const chordFactoryLink =
      document.getElementById("chordFactoryLink");

    const designStudioLink =
      document.getElementById("designStudioLink");

    const designStudioTopLink =
      document.getElementById("designStudioTopLink");

    const progressionLink =
      document.getElementById("progressionLink");

    const pitchClasses =
      ORUMI_CATALOG.pitchClasses;

    const numberToPitchClass =
      ORUMI_CATALOG.numberToPitchClass;

    const systems =
      ORUMI_CATALOG.systems;

    const voices =
      ORUMI_CATALOG.voices;

    const params =
      new URLSearchParams(window.location.search);

    let selectedSystemKey =
      params.get("system") || "western";

    if (!systems[selectedSystemKey]) {
      selectedSystemKey = "western";
    }

    let selectedSystem =
      systems[selectedSystemKey];

    let selectedRoot =
      params.get("root") ||
      selectedSystem.defaultRoot ||
      "C";

    if (!pitchClasses[selectedRoot]) {
      selectedRoot = "C";
    }

    let selectedFamily =
      params.get("family") ||
      selectedSystem.defaultFamily ||
      Object.keys(selectedSystem.families || {})[0];

    let selectedMode =
      params.get("scaleMode") ||
      selectedSystem.defaultMode;

    let selectedSet =
      params.get("set") ||
      selectedSystem.defaultSet ||
      "native";

    if (!["native", "full"].includes(selectedSet)) {
      selectedSet = "native";
    }

    let selectedOctaves =
      parseOctaves(
        params.get("octaves") ||
        (selectedSystem.defaultOctaves || [2,3,4,5]).join(",")
      );

    let selectedVoice =
      params.get("voice") ||
      selectedSystem.defaultVoice ||
      "softKeys";

    if (!voices[selectedVoice]) {
      selectedVoice =
        selectedSystem.defaultVoice || "softKeys";
    }

    const highlightedNotes =
      parseHighlightedNotes(params.get("highlight"));

    backButton.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });

    function parseOctaves(value) {
      const parsed =
        String(value)
          .split(",")
          .map(item => parseInt(item.trim(), 10))
          .filter(item => Number.isInteger(item));

      const valid =
        parsed.filter(item => [1,2,3,4,5,6].includes(item));

      return valid.length > 0
        ? [...new Set(valid)].sort((a,b) => a - b)
        : [2,3,4,5];
    }

    function parseHighlightedNotes(value) {
      if (!value) {
        return new Set();
      }

      return new Set(
        String(value)
          .split(",")
          .map(item => item.trim())
          .filter(Boolean)
      );
    }

    function pcToName(pcNumber) {
      return numberToPitchClass[
        ((pcNumber % 12) + 12) % 12
      ];
    }

    function midiToFrequency(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function midiToDisplayName(midi) {
      const pcName =
        pcToName(midi % 12);

      const octave =
        Math.floor(midi / 12) - 1;

      return pcName + octave;
    }

    function noteNameToMidi(noteName) {
      const match =
        String(noteName).match(/^([A-G][b]?)(-?\d+)$/);

      if (!match) {
        return null;
      }

      const pc = match[1];
      const octave = parseInt(match[2], 10);

      if (!pitchClasses[pc]) {
        return null;
      }

      return 12 * (octave + 1) +
        pitchClasses[pc].number;
    }

    function getCurrentFamily() {
      const families =
        selectedSystem.families || {};

      if (!families[selectedFamily]) {
        selectedFamily =
          selectedSystem.defaultFamily ||
          Object.keys(families)[0];
      }

      return families[selectedFamily];
    }

    function getCurrentMode() {
      const family =
        getCurrentFamily();

      const modes =
        family && family.modes
          ? family.modes
          : {};

      if (!modes[selectedMode]) {
        selectedMode =
          selectedSystem.defaultMode ||
          Object.keys(modes)[0];
      }

      return modes[selectedMode];
    }

    function getNativePitchNumbers() {
      const rootNumber =
        pitchClasses[selectedRoot].number;

      const mode =
        getCurrentMode();

      if (!mode || !Array.isArray(mode.formula)) {
        return new Set([0,2,4,5,7,9,11].map(
          interval => (rootNumber + interval) % 12
        ));
      }

      return new Set(
        mode.formula.map(
          interval => (rootNumber + interval) % 12
        )
      );
    }

    function isNativeMidi(midi) {
      const pcNumber =
        ((midi % 12) + 12) % 12;

      return getNativePitchNumbers().has(pcNumber);
    }

    function getChromaticFromRoot() {
      const rootNumber =
        pitchClasses[selectedRoot].number;

      const result = [];

      for (let i = 0; i < 12; i++) {
        result.push(pcToName(rootNumber + i));
      }

      return result;
    }

    function getVisiblePitchClasses() {
      const chromatic =
        getChromaticFromRoot();

      if (selectedSet === "full") {
        return chromatic;
      }

      const nativeSet =
        getNativePitchNumbers();

      return chromatic.filter(pc => {
        return nativeSet.has(pitchClasses[pc].number);
      });
    }

    function getNoteObjects() {
      const pitchNames =
        getVisiblePitchClasses();

      const notes = [];

      selectedOctaves.forEach(octave => {
        pitchNames.forEach(pcName => {
          const midi =
            12 * (octave + 1) +
            pitchClasses[pcName].number;

          notes.push({
            midi,
            pcName,
            octave,
            displayName: pcName + octave,
            frequency: midiToFrequency(midi),
            className: pitchClasses[pcName].className,
            display: pitchClasses[pcName].display,
            native: isNativeMidi(midi)
          });
        });
      });

      return notes;
    }

    function buildUrl(pageName) {
      const urlParams =
        new URLSearchParams();

      urlParams.set("system", selectedSystemKey);
      urlParams.set("root", selectedRoot);
      urlParams.set("family", selectedFamily);
      urlParams.set("scaleMode", selectedMode);
      urlParams.set("set", selectedSet);
      urlParams.set("octaves", selectedOctaves.join(","));
      urlParams.set("voice", selectedVoice);

      return pageName + "?" + urlParams.toString();
    }

    function refreshNavLinks() {
      selectionLink.href =
        buildUrl("selection-control.html");

      chordFactoryLink.href =
        buildUrl("chord-factory.html");

      designStudioLink.href =
        "design-studio.html";

      designStudioTopLink.href =
        "design-studio.html";

      progressionLink.href =
        "progression-builder.html";
    }

    function renderInfo() {
      const family =
        getCurrentFamily();

      const mode =
        getCurrentMode();

      pageTitle.textContent =
        selectedSystem.label + " Player";

      subtitle.textContent =
        "Press Begin Sound, then play Orumi sound squares.";

      selectionSummary.textContent =
        selectedSystem.label +
        " · Key " +
        pitchClasses[selectedRoot].display +
        " · " +
        (family ? family.label : selectedFamily) +
        " · " +
        (mode ? mode.label : selectedMode) +
        " · " +
        (selectedSet === "full" ? "Full Set" : "Native Set") +
        " · Octaves " +
        selectedOctaves.join(", ") +
        " · " +
        voices[selectedVoice].label;

      if (highlightedNotes.size > 0) {
        highlightSummary.textContent =
          "Highlighted chord tones: " +
          Array.from(highlightedNotes).join(" · ");
      } else {
        highlightSummary.textContent = "";
      }
    }

    function renderNotes() {
      noteGrid.innerHTML = "";

      const pitchNames =
        getVisiblePitchClasses();

      selectedOctaves.forEach(octave => {
        const row =
          document.createElement("div");

        row.classList.add("octave-row");

        pitchNames.forEach(pcName => {
          const midi =
            12 * (octave + 1) +
            pitchClasses[pcName].number;

          const displayName =
            pcName + octave;

          const note =
            {
              midi,
              pcName,
              octave,
              displayName,
              frequency: midiToFrequency(midi),
              className: pitchClasses[pcName].className,
              display: pitchClasses[pcName].display,
              native: isNativeMidi(midi)
            };

          const button =
            document.createElement("button");

          button.classList.add(
            "note-button",
            note.className
          );

          if (note.native) {
            button.classList.add("native");
          } else {
            button.classList.add("outside");
          }

          if (highlightedNotes.has(note.displayName)) {
            button.classList.add("highlighted");
          }

          if (pcName === "E" || pcName === "Eb") {
            button.style.color = "#222";
            button.style.textShadow = "none";
          }

          button.innerHTML =
            "<span class='note-label'>" +
            note.displayName +
            "</span>" +
            "<span class='note-sub'>" +
            note.display +
            "</span>";

          button.title =
            note.displayName;

          button.addEventListener("pointerdown", event => {
            event.preventDefault();
            startNote(note, button);
          });

          button.addEventListener("pointerup", event => {
            event.preventDefault();
            stopNote(note.midi, button);
          });

          button.addEventListener("pointerleave", () => {
            stopNote(note.midi, button);
          });

          button.addEventListener("pointercancel", () => {
            stopNote(note.midi, button);
          });

          row.appendChild(button);
        });

        noteGrid.appendChild(row);
      });
    }

    async function ensureAudio() {
      if (!audioContext) {
        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      soundReady = true;
      beginSoundButton.textContent = "Sound Ready";
      beginSoundButton.classList.add("ready");
      status.textContent = "Sound is ready.";
    }

    async function beginSound() {
      await ensureAudio();

      if (getDroneConfig()) {
        await startDrone();
      }

      updateDroneUi();
    }

    function getDroneConfig() {
      if (
        !selectedSystem ||
        !selectedSystem.drone ||
        !selectedSystem.drone.enabled
      ) {
        return null;
      }

      return selectedSystem.drone;
    }

    function getDroneMidiNotes() {
      const config =
        getDroneConfig();

      if (!config) {
        return [];
      }

      const rootNumber =
        pitchClasses[selectedRoot].number;

      const octave =
        Number.isInteger(config.octave)
          ? config.octave
          : 2;

      const intervals =
        Array.isArray(config.intervals)
          ? config.intervals
          : [0, 7];

      return intervals.map(interval => {
        const midi =
          12 * (octave + 1) +
          rootNumber +
          interval;

        return {
          midi,
          displayName: midiToDisplayName(midi),
          frequency: midiToFrequency(midi)
        };
      });
    }

    async function startDrone() {
      const config =
        getDroneConfig();

      if (!config) {
        updateDroneUi();
        return;
      }

      await ensureAudio();

      stopDrone();

      const voice =
        config.voice && voices[config.voice]
          ? config.voice
          : "organ";

      const now =
        audioContext.currentTime;

      droneNotes =
        getDroneMidiNotes().map(note => {
          const voiceNode =
            ORUMI_VOICES.buildVoice(
              audioContext,
              voice,
              note.frequency,
              now
            );

          return {
            voice,
            gain: voiceNode.gain,
            oscillators: voiceNode.oscillators || [],
            noiseSources: voiceNode.noiseSources || []
          };
        });

      droneActive = true;
      updateDroneUi();
    }

    function stopDrone() {
      if (!audioContext) {
        droneNotes = [];
        droneActive = false;
        updateDroneUi();
        return;
      }

      droneNotes.forEach(note => {
        ORUMI_VOICES.stopVoice(
          note,
          audioContext,
          0.65
        );
      });

      droneNotes = [];
      droneActive = false;
      updateDroneUi();
    }

    async function toggleDrone() {
      if (droneActive) {
        stopDrone();
      } else {
        await startDrone();
      }
    }

    function updateDroneUi() {
      const config =
        getDroneConfig();

      if (!config) {
        droneButton.style.display = "none";
        droneStatus.textContent = "";
        return;
      }

      droneButton.style.display = "block";
      droneButton.textContent =
        droneActive ? "Stop Drone" : "Start Drone";

      droneButton.classList.toggle(
        "active",
        droneActive
      );

      const notes =
        getDroneMidiNotes()
          .map(note => note.displayName)
          .join(" · ");

      droneStatus.textContent =
        selectedSystem.label +
        " drone available: " +
        notes;
    }

    async function startNote(note, button) {
      await ensureAudio();

      if (activeNotes.has(note.midi)) {
        return;
      }

      const now =
        audioContext.currentTime;

      const voiceNode =
        ORUMI_VOICES.buildVoice(
          audioContext,
          selectedVoice,
          note.frequency,
          now
        );

      const activeNote = {
        voice: selectedVoice,
        gain: voiceNode.gain,
        oscillators: voiceNode.oscillators || [],
        noiseSources: voiceNode.noiseSources || []
      };

      activeNotes.set(note.midi, activeNote);

      if (button) {
        button.classList.add("playing");
      }

      if (isRecording) {
        activeRecordingNotes.set(note.midi, {
          note,
          start: performance.now()
        });
      }
    }

    function stopNote(midi, button) {
      if (!activeNotes.has(midi)) {
        return;
      }

      const activeNote =
        activeNotes.get(midi);

      if (audioContext) {
        ORUMI_VOICES.stopVoice(
          activeNote,
          audioContext,
          0.16
        );
      }

      activeNotes.delete(midi);

      if (button) {
        button.classList.remove("playing");
      }

      if (
        isRecording &&
        activeRecordingNotes.has(midi)
      ) {
        const recordingNote =
          activeRecordingNotes.get(midi);

        const startSeconds =
          (recordingNote.start - recordingStartTime) / 1000;

        const durationSeconds =
          Math.max(
            0.12,
            (performance.now() - recordingNote.start) / 1000
          );

        currentRecording.push({
          type: "note",
          name: recordingNote.note.displayName,
          start: startSeconds,
          duration: durationSeconds,
          notes: [
            {
              midi: recordingNote.note.midi,
              name: recordingNote.note.displayName
            }
          ],
          voice: selectedVoice,
          system: selectedSystemKey,
          root: selectedRoot,
          family: selectedFamily,
          mode: selectedMode,
          setView: selectedSet
        });

        activeRecordingNotes.delete(midi);
        saveCurrentRecording();

        updateRecordingStatus();
      }
    }

    function stopAllNotes() {
      activeNotes.forEach((note, midi) => {
        if (audioContext) {
          ORUMI_VOICES.stopVoice(
            note,
            audioContext,
            0.16
          );
        }
      });

      activeNotes.clear();

      document.querySelectorAll(".note-button.playing")
        .forEach(button => {
          button.classList.remove("playing");
        });
    }

    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      currentRecording = [];
      activeRecordingNotes.clear();
      recordingStartTime = performance.now();
      isRecording = true;

      recordButton.textContent = "Stop Recording";
      recordButton.classList.add("recording");

      updateRecordingStatus();
      status.textContent = "Recording started.";
    }

    function stopRecording() {
      isRecording = false;

      activeRecordingNotes.forEach((recordingNote, midi) => {
        const startSeconds =
          (recordingNote.start - recordingStartTime) / 1000;

        const durationSeconds =
          Math.max(
            0.12,
            (performance.now() - recordingNote.start) / 1000
          );

        currentRecording.push({
          type: "note",
          name: recordingNote.note.displayName,
          start: startSeconds,
          duration: durationSeconds,
          notes: [
            {
              midi: recordingNote.note.midi,
              name: recordingNote.note.displayName
            }
          ],
          voice: selectedVoice,
          system: selectedSystemKey,
          root: selectedRoot,
          family: selectedFamily,
          mode: selectedMode,
          setView: selectedSet
        });
      });

      activeRecordingNotes.clear();
      saveCurrentRecording();

      recordButton.textContent = "Start Recording";
      recordButton.classList.remove("recording");

      updateRecordingStatus();
      status.textContent = "Recording stopped. Open Design Studio and choose Import Recording.";
    }

    function saveCurrentRecording() {
      localStorage.setItem(
        "orumiCurrentRecording",
        JSON.stringify(currentRecording)
      );
    }

    function loadCurrentRecording() {
      currentRecording =
        JSON.parse(
          localStorage.getItem("orumiCurrentRecording") || "[]"
        );

      if (!Array.isArray(currentRecording)) {
        currentRecording = [];
      }

      updateRecordingStatus();
    }

    function clearTake() {
      if (isRecording) {
        stopRecording();
      }

      currentRecording = [];
      activeRecordingNotes.clear();

      localStorage.setItem(
        "orumiCurrentRecording",
        JSON.stringify([])
      );

      updateRecordingStatus();
      status.textContent = "Current take cleared.";
    }

    function updateRecordingStatus() {
      if (isRecording) {
        recordingStatus.textContent =
          "Recording... " +
          currentRecording.length +
          " captured note" +
          (currentRecording.length === 1 ? "" : "s");
        return;
      }

      if (currentRecording.length === 0) {
        recordingStatus.textContent =
          "No active recording.";
      } else {
        recordingStatus.textContent =
          currentRecording.length +
          " recorded note" +
          (currentRecording.length === 1 ? "" : "s") +
          " ready for Design Studio.";
      }
    }

    function init() {
      getCurrentFamily();
      getCurrentMode();

      refreshNavLinks();
      renderInfo();
      renderNotes();
      loadCurrentRecording();
      updateDroneUi();

      if (getDroneConfig()) {
        droneStatus.textContent =
          selectedSystem.label +
          " has a drone. Press Begin Sound to start it.";
      }
    }

    beginSoundButton.addEventListener("click", beginSound);
    recordButton.addEventListener("click", toggleRecording);
    clearTakeButton.addEventListener("click", clearTake);
    droneButton.addEventListener("click", toggleDrone);

    window.addEventListener("pointerup", () => {
      document.querySelectorAll(".note-button.playing")
        .forEach(button => {
          const text =
            button.querySelector(".note-label")?.textContent;

          if (!text) return;

          const midi =
            noteNameToMidi(text);

          if (midi !== null) {
            stopNote(midi, button);
          }
        });
    });

    window.addEventListener("beforeunload", () => {
      stopAllNotes();
      stopDrone();

      if (isRecording) {
        stopRecording();
      }
    });

    init();
  </script>

</body>
</html>
