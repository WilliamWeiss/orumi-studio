<!DOCTYPE html>
<html>
<head>
  <title>Orumi Sound Squares</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/assets/orumi-icon.png" />
  <script src="js/orumi-catalog.js"></script>
  <link rel="stylesheet" href="css/orumi-theme.css">


  <style>
    body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
}

    .site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px clamp(20px, 5vw, 72px);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo,
.logo:visited {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: var(--text);
}

.logo img {
  width: 125px;
  height: 125px;
  object-fit: contain;
  display: block;
}

.logo span {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  letter-spacing: 0.02em;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  font-size: 0.95rem;
}

nav a,
nav a:visited {
  color: #b9b3a7;
  text-decoration: none;
}

nav a:hover {
  color: var(--text);
}

.play-page {
  min-height: calc(100vh - 174px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px 48px;
}

@media (max-width: 720px) {
  .site-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }

  .logo img {
    width: 86px;
    height: 86px;
  }

  .logo span {
    font-size: 2rem;
  }

  .play-page {
    min-height: auto;
    justify-content: flex-start;
  }
}

    h1 {
      margin: 10px 0 6px 0;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #bdb4a6;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .menu-grid {
      display: grid;
      width: min(94vmin, 680px);
      height: min(72vmin, 510px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3%;
    }

    .tile {
      text-decoration: none;
      color: #fff7ea;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.38);
      transition: 0.12s;
      user-select: none;
      text-align: center;
      padding: 8px;
      box-sizing: border-box;
    }

    .tile:active,
    .tile:hover {
      transform: scale(0.95);
      filter: brightness(1.18);
      box-shadow: 0 0 26px rgba(255,255,255,0.25);
    }

    .abbr {
      font-size: clamp(28px, 8vmin, 54px);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .label {
      margin-top: 8px;
      font-size: clamp(11px, 2.4vmin, 16px);
      opacity: 0.9;
      line-height: 1.15;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .western  { background: #4d6f91; }
    .japanese { background: #7a6a53; }
    .chinese  { background: #8f3f2f; }
    .indian   { background: #d08a2d; color: #18120c; }
    .maqam    { background: #5b4a6b; }
    .celtic   { background: #47624f; }
    .blues    { background: #3f4e6f; }
    .custom   { background: linear-gradient(135deg, #8b3e2f, #3f4e6f, #5b4a6b); }
    .andean   { background: #5f6f72; }
    .factory  { background: #7b586e; }
    .progression { background: #38444a; }
    .designer { background: #3f6c68; }


    .design-symbol {
      display: grid;
      place-items: center;
      width: clamp(58px, 10vmin, 86px);
      height: clamp(58px, 10vmin, 86px);
      margin-bottom: 2px;
    }

    .design-studio-mini-icon {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.32));
    }

    .design-studio-mini-icon .ds-grid-line {
      stroke: rgba(245,240,232,0.58);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .design-studio-mini-icon .ds-selected-square {
      fill: #4d96ff;
      stroke: rgba(255,255,255,0.94);
      stroke-width: 2.2;
    }

    .design-studio-mini-icon .ds-selection-handle {
      fill: #f5f0e8;
      stroke: rgba(0,0,0,0.35);
      stroke-width: 1;
    }

    .design-studio-mini-icon .ds-ghost-square {
      fill: rgba(255,255,255,0.20);
      stroke: rgba(255,255,255,0.30);
      stroke-width: 1;
    }


    .tool-symbol {
      display: grid;
      place-items: center;
      width: clamp(58px, 10vmin, 86px);
      height: clamp(58px, 10vmin, 86px);
      margin-bottom: 2px;
      line-height: 1;
    }

    .orumi-tool-icon {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.30));
    }

    .orumi-tool-icon .icon-stroke {
      fill: none;
      stroke: rgba(245,240,232,0.92);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .orumi-tool-icon .icon-soft-stroke {
      fill: none;
      stroke: rgba(245,240,232,0.48);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .orumi-tool-icon .icon-fill {
      fill: rgba(245,240,232,0.92);
    }

    .orumi-tool-icon .icon-muted-fill {
      fill: rgba(245,240,232,0.20);
      stroke: rgba(245,240,232,0.42);
      stroke-width: 1.5;
    }

    .orumi-tool-icon .icon-blue-square {
      fill: #4d96ff;
      stroke: rgba(255,255,255,0.94);
      stroke-width: 2.2;
    }
  </style>
</head>

<body>

  <header class="site-header">
  <a class="logo" href="/" aria-label="Return to Orumi home">
    <img src="/assets/orumi-icon.png" alt="" aria-hidden="true" />
    <span>Orumi</span>
  </a>

  <nav>
    <a href="/studio/">Studio</a>
    <a href="/intervals/">Intervals</a>
    <a href="/language/">Language</a>
    <a href="/play/">Play</a>
    <a href="/lyric-bridge/">Lyric Bridge</a>
    <a href="/learn/">Learn</a>
  </nav>
</header>

<main class="play-page">
  <h1>Orumi Sound Squares</h1>

  <div class="subtitle">
    Choose a musical world
  </div>

  <div class="menu-grid" id="menuGrid"></div>
</main>

<script>
  const menuGrid = document.getElementById("menuGrid");
    const systems = ORUMI_CATALOG.systems;
    const CUSTOM_SOUND_SQUARE_KEY = "orumiCustomSoundSquare";

    const systemOrder = [
      "western",
      "japanese",
      "chinese",
      "indian",
      "maqam",
      "celtic",
      "blues",
      "custom",
      "andean",
      "chordFactory",
      "progression",
      "designer"
    ];

    function safeJsonParse(value) {
      if (!value) return null;
      try {
        return JSON.parse(value);
      } catch (error) {
        return null;
      }
    }

    function getSavedCustomSquare() {
      const saved = safeJsonParse(localStorage.getItem(CUSTOM_SOUND_SQUARE_KEY));
      return saved && typeof saved === "object" ? saved : null;
    }

    function getDisplayOctaves(system) {
      const defaults = Array.isArray(system && system.defaultOctaves)
        ? system.defaultOctaves
        : [3,4,5];

      const cleaned = [...new Set(defaults)]
        .map(value => parseInt(value, 10))
        .filter(value => value >= 1 && value <= 6)
        .sort((a, b) => a - b);

      if (cleaned.length > 3) {
        return cleaned.slice(cleaned.length - 3);
      }

      return cleaned.length ? cleaned : [3,4,5];
    }

    function buildSystemLink(systemKey, system) {
      const root = encodeURIComponent(system.defaultRoot || "C");
      const family = encodeURIComponent(system.defaultFamily);
      const scaleMode = encodeURIComponent(system.defaultMode);
      const setView = encodeURIComponent(system.defaultSet || "native");
      const octaves = encodeURIComponent(
        getDisplayOctaves(system).join(",")
      );
      const voice = encodeURIComponent(system.defaultVoice || "warm");

      return (
        "player.html" +
        "?system=" + encodeURIComponent(systemKey) +
        "&root=" + root +
        "&family=" + family +
        "&scaleMode=" + scaleMode +
        "&set=" + setView +
        "&octaves=" + octaves +
        "&voice=" + voice
      );
    }

    function buildCustomTile() {
      const saved = getSavedCustomSquare();
      const link = document.createElement("a");
      link.classList.add("tile", "custom");
      link.href = saved ? "player.html?custom=1" : "selection-control.html?custom=1&return=player";
      link.title = saved
        ? "Open your locally saved custom sound square."
        : "Create a custom sound square on this device using Selection Control.";

      const abbr = document.createElement("div");
      abbr.classList.add("abbr");
      abbr.textContent = saved ? "CU" : "+";

      const label = document.createElement("div");
      label.classList.add("label");
      label.textContent = saved && saved.name ? saved.name : "Custom";

      link.appendChild(abbr);
      link.appendChild(label);
      return link;
    }


    function getToolIconSvg(kind) {
      if (kind === "chordFactory") {
        return `<svg class="orumi-tool-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect class="icon-muted-fill" x="14" y="14" width="15" height="15" rx="2"></rect>
          <rect class="icon-muted-fill" x="35" y="14" width="15" height="15" rx="2"></rect>
          <rect class="icon-muted-fill" x="14" y="35" width="15" height="15" rx="2"></rect>
          <rect class="icon-muted-fill" x="35" y="35" width="15" height="15" rx="2"></rect>
          <line class="icon-stroke" x1="32" y1="10" x2="32" y2="54"></line>
          <line class="icon-stroke" x1="10" y1="32" x2="54" y2="32"></line>
        </svg>`;
      }

      if (kind === "progression") {
        return `<svg class="orumi-tool-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <line class="icon-stroke" x1="18" y1="16" x2="48" y2="16"></line>
          <line class="icon-stroke" x1="18" y1="32" x2="48" y2="32"></line>
          <line class="icon-stroke" x1="18" y1="48" x2="48" y2="48"></line>
          <circle class="icon-fill" cx="12" cy="16" r="3"></circle>
          <circle class="icon-fill" cx="12" cy="32" r="3"></circle>
          <circle class="icon-fill" cx="12" cy="48" r="3"></circle>
        </svg>`;
      }

      return `<svg class="orumi-tool-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <line class="icon-soft-stroke" x1="9" y1="15" x2="55" y2="15"></line>
        <line class="icon-soft-stroke" x1="9" y1="27" x2="55" y2="27"></line>
        <line class="icon-soft-stroke" x1="9" y1="39" x2="55" y2="39"></line>
        <line class="icon-soft-stroke" x1="9" y1="51" x2="55" y2="51"></line>
        <rect class="icon-muted-fill" x="14" y="10" width="10" height="10" rx="2"></rect>
        <rect class="icon-muted-fill" x="40" y="34" width="10" height="10" rx="2"></rect>
        <rect class="icon-blue-square" x="26" y="21" width="16" height="16" rx="3"></rect>
        <rect class="icon-fill" x="22" y="17" width="6" height="6" rx="1"></rect>
        <rect class="icon-fill" x="40" y="17" width="6" height="6" rx="1"></rect>
        <rect class="icon-fill" x="22" y="35" width="6" height="6" rx="1"></rect>
        <rect class="icon-fill" x="40" y="35" width="6" height="6" rx="1"></rect>
      </svg>`;
    }

    function buildToolTile(kind) {
      const tileInfo = {
        chordFactory: {
          className: "factory",
          href: "chord-factory.html",
          label: "Chord Factory",
          title: "Open Chord Factory"
        },
        progression: {
          className: "progression",
          href: "progression-builder.html",
          label: "Progression Studio",
          title: "Open Progression Studio"
        },
        designer: {
          className: "designer",
          href: "design-studio.html",
          label: "Design Studio",
          title: "Open Design Studio"
        }
      }[kind];

      const link = document.createElement("a");
      link.classList.add("tile", tileInfo.className);
      link.href = tileInfo.href;
      link.title = tileInfo.title;

      const abbr = document.createElement("div");
      abbr.classList.add("abbr", "tool-symbol");
      abbr.innerHTML = getToolIconSvg(kind);

      const label = document.createElement("div");
      label.classList.add("label");
      label.textContent = tileInfo.label;

      link.appendChild(abbr);
      link.appendChild(label);
      return link;
    }

    function buildMenu() {
      menuGrid.innerHTML = "";

      systemOrder.forEach(systemKey => {
        if (systemKey === "custom") {
          menuGrid.appendChild(buildCustomTile());
          return;
        }

        if (["chordFactory", "progression", "designer"].includes(systemKey)) {
          menuGrid.appendChild(buildToolTile(systemKey));
          return;
        }

        const system = systems[systemKey];
        if (!system) return;

        const link = document.createElement("a");
        link.classList.add("tile");
        link.classList.add(systemKey);
        link.href = buildSystemLink(systemKey, system);

        const abbr = document.createElement("div");
        abbr.classList.add("abbr");
        abbr.textContent = system.shortLabel || system.label.slice(0, 2).toUpperCase();

        const label = document.createElement("div");
        label.classList.add("label");
        label.textContent = system.label;

        link.appendChild(abbr);
        link.appendChild(label);

        menuGrid.appendChild(link);
      });
    }

    buildMenu();
  </script>

</body>
</html>
