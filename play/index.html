<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Orumi Sound Squares</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/orumi-catalog.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 10px 0 6px 0;
      font-weight: 500;
      letter-spacing: 1px;
      text-align: center;
    }

    .subtitle {
      color: #bdb4a6;
      margin-bottom: 22px;
      font-size: 14px;
      text-align: center;
    }

    .menu-grid {
      display: grid;
      width: min(92vmin, 640px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 14px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      text-decoration: none;
      color: #fff7ea;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.38);
      transition: 0.12s;
      user-select: none;
    }

    .tile:active,
    .tile:hover {
      transform: scale(0.95);
      filter: brightness(1.18);
      box-shadow: 0 0 26px rgba(255,255,255,0.25);
    }

    .abbr {
      font-size: clamp(22px, 5.8vmin, 44px);
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1;
    }

    .label {
      margin-top: 8px;
      font-size: clamp(10px, 1.9vmin, 14px);
      opacity: 0.9;
      line-height: 1.1;
      padding: 0 6px;
    }

    .western  { background: #4d6f91; }
    .japanese { background: #7a6a53; }
    .chinese  { background: #8f3f2f; }
    .indian   { background: #d08a2d; color: #18120c; }
    .maqam    { background: #5b4a6b; }
    .celtic   { background: #47624f; }
    .blues    { background: #3f4e6f; }
    .african  { background: #8b3e2f; }
    .andean   { background: #5f6f72; }

    .chordfactory { background: #5b4f7a; }
    .recordingstudio { background: #6a4f2f; }
    .designstudio { background: #2f665f; }

    @media (max-width: 620px) {
      .menu-grid {
        width: min(94vw, 460px);
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: auto;
        gap: 10px;
      }

      .tile {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <h1>Orumi Sound Squares</h1>

  <div class="subtitle">
    Choose a musical world or studio
  </div>

  <div class="menu-grid" id="menuGrid"></div>

  <script>
    const menuGrid = document.getElementById("menuGrid");
    const systems = ORUMI_CATALOG.systems;

    const systemOrder = [
      "western",
      "japanese",
      "chinese",
      "indian",

      "maqam",
      "celtic",
      "blues",
      "african",

      "andean",
      "chordfactory",
      "recordingstudio",
      "designstudio"
    ];

    function buildSystemLink(systemKey, system) {
      const root = encodeURIComponent(system.defaultRoot || "C");
      const family = encodeURIComponent(system.defaultFamily);
      const scaleMode = encodeURIComponent(system.defaultMode);
      const setView = encodeURIComponent(system.defaultSet || "native");

      const octaves = encodeURIComponent(
        (system.defaultOctaves || [2,3,4,5]).join(",")
      );

      const voice = encodeURIComponent(system.defaultVoice || "warm");

      return (
        "player.html" +
        "?system=" + encodeURIComponent(systemKey) +
        "&root=" + root +
        "&family=" + family +
        "&scaleMode=" + scaleMode +
        "&set=" + setView +
        "&octaves=" + octaves +
        "&voice=" + voice
      );
    }

    function createTile(className, href, abbrText, labelText) {
      const link = document.createElement("a");

      link.classList.add("tile", className);
      link.href = href;

      const abbr = document.createElement("div");
      abbr.classList.add("abbr");
      abbr.textContent = abbrText;

      const label = document.createElement("div");
      label.classList.add("label");
      label.textContent = labelText;

      link.appendChild(abbr);
      link.appendChild(label);

      return link;
    }

    function buildMenu() {
      menuGrid.innerHTML = "";

      systemOrder.forEach(systemKey => {

        if (systemKey === "chordfactory") {
          menuGrid.appendChild(
            createTile(
              "chordfactory",
              "chord-factory.html",
              "CF",
              "Chord Factory"
            )
          );

          return;
        }

        if (systemKey === "recordingstudio") {
          menuGrid.appendChild(
            createTile(
              "recordingstudio",
              "recording-studio.html",
              "RS",
              "Recording Studio"
            )
          );

          return;
        }

        if (systemKey === "designstudio") {
          menuGrid.appendChild(
            createTile(
              "designstudio",
              "design-studio.html",
              "DS",
              "Design Studio"
            )
          );

          return;
        }

        const system = systems[systemKey];

        if (!system) {
          return;
        }

        menuGrid.appendChild(
          createTile(
            systemKey,
            buildSystemLink(systemKey, system),
            system.shortLabel || system.label.slice(0, 2).toUpperCase(),
            system.label
          )
        );
      });
    }

    buildMenu();
  </script>

</body>
</html>
