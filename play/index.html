<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play Orumi</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Orumi</a>
    <nav>
      <a href="/studio/">Studio</a>
      <a href="/language/">Language</a>
      <a href="/play/">Play</a>
    </nav>
  </header>

  <main class="page">
    <h1>Play Orumi</h1>
    <p class="lede">
      A simple interactive sound-square prototype will live here.
    </p>

    <section class="play-grid">
      <button class="sq red" aria-label="Red square"></button>
      <button class="sq orange" aria-label="Orange square"></button>
      <button class="sq yellow" aria-label="Yellow square"></button>
      <button class="sq green" aria-label="Green square"></button>
      <button class="sq blue" aria-label="Blue square"></button>
      <button class="sq purple" aria-label="Purple square"></button>
    </section>
  </main>
</body>
</html>
