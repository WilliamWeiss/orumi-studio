<!DOCTYPE html>
<html>
<head>
  <title>Andean Sound Square</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121619;
      color: #edf2ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    h1 {
      margin: 10px 0;
      font-weight: 500;
    }

    #startButton {
      font-size: 18px;
      padding: 12px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      background: #c98b5a;
      color: #121619;
      cursor: pointer;
    }

    #status {
      margin-bottom: 10px;
      color: #c7d1cf;
      font-size: 14px;
      height: 20px;
    }

    .grid {
      display: grid;
      width: min(90vmin, 420px);
      height: min(90vmin, 420px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 2%;
    }

    .square {
      border: none;
      border-radius: 18px;
      font-size: clamp(15px, 3.5vmin, 26px);
      font-weight: bold;
      color: #f7f1e8;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: 0.08s;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      background: rgba(255,255,255,0.82);
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
      z-index: 1000;
    }

    .square.active {
      transform: scale(0.9);
      filter: brightness(1.35);
      box-shadow: 0 0 24px rgba(190,220,220,0.75);
    }

    .a { background: #7b4f3a; }
    .c { background: #5f6f72; }
    .d { background: #7a7f62; }
    .e { background: #b28a58; }
    .g { background: #4f6f5f; }
  </style>
</head>

<body>

  <a class="back-button" href="index.html">← Back to Menu</a>

  <h1>Andean Square</h1>

  <button id="startButton">Start Audio</button>

  <div id="status">Tap Start Audio</div>

  <div class="grid">

    <button class="square a"
      data-name="A3"
      data-note="220.00">
      A3
    </button>

    <button class="square c"
      data-name="C4"
      data-note="261.63">
      C4
    </button>

    <button class="square d"
      data-name="D4"
      data-note="293.66">
      D4
    </button>

    <button class="square e"
      data-name="E4"
      data-note="329.63">
      E4
    </button>

    <button class="square g"
      data-name="G4"
      data-note="392.00">
      G4
    </button>

    <button class="square a"
      data-name="A4"
      data-note="440.00">
      A4
    </button>

    <button class="square c"
      data-name="C5"
      data-note="523.25">
      C5
    </button>

    <button class="square d"
      data-name="D5"
      data-note="587.33">
      D5
    </button>

    <button class="square e"
      data-name="E5"
      data-note="659.25">
      E5
    </button>

    <button class="square g"
      data-name="G5"
      data-note="783.99">
      G5
    </button>

    <button class="square a"
      data-name="A5"
      data-note="880.00">
      A5
    </button>

    <button class="square c"
      data-name="C6"
      data-note="1046.50">
      C6
    </button>

    <button class="square d"
      data-name="D6"
      data-note="1174.66">
      D6
    </button>

    <button class="square e"
      data-name="E6"
      data-note="1318.51">
      E6
    </button>

    <button class="square g"
      data-name="G6"
      data-note="1567.98">
      G6
    </button>

    <button class="square a"
      data-name="A6"
      data-note="1760.00">
      A6
    </button>

  </div>

  <script>

    let audioContext;
    let currentFingerButton = null;
    let droneOsc = null;
    let droneGain = null;

    const startButton =
      document.getElementById("startButton");

    const statusText =
      document.getElementById("status");

    function startAudio() {

      if (audioContext) return;

      audioContext =
        new (window.AudioContext ||
         window.webkitAudioContext)();

      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      osc.frequency.value = 440;
      gain.gain.value = 0.035;

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + 0.1);

      startWindDrone();

      statusText.textContent = "Audio Ready";

      startButton.style.display = "none";
    }

    startButton.addEventListener(
      "click",
      startAudio
    );

    startButton.addEventListener(
      "touchend",
      startAudio
    );

    function startWindDrone() {

      const now =
        audioContext.currentTime;

      droneGain =
        audioContext.createGain();

      droneGain.gain.setValueAtTime(
        0.0001,
        now
      );

      droneGain.gain.exponentialRampToValueAtTime(
        0.018,
        now + 1.5
      );

      const filter =
        audioContext.createBiquadFilter();

      filter.type = "lowpass";

      filter.frequency.value = 350;

      droneOsc =
        audioContext.createOscillator();

      droneOsc.type = "sine";

      droneOsc.frequency.value = 110.00;

      droneOsc.connect(filter);

      filter.connect(droneGain);

      droneGain.connect(audioContext.destination);

      droneOsc.start();
    }

    function playNote(freq) {

      if (!audioContext) {

        statusText.textContent =
          "Tap Start Audio first";

        return;
      }

      const now =
        audioContext.currentTime;

      const gain =
        audioContext.createGain();

      gain.gain.setValueAtTime(
        0.0001,
        now
      );

      gain.gain.linearRampToValueAtTime(
        0.20,
        now + 0.06
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 1.4
      );

      const osc1 =
        audioContext.createOscillator();

      osc1.type = "sine";

      osc1.frequency.setValueAtTime(
        freq,
        now
      );

      const osc2 =
        audioContext.createOscillator();

      osc2.type = "triangle";

      osc2.frequency.setValueAtTime(
        freq * 2,
        now
      );

      const osc2Gain =
        audioContext.createGain();

      osc2Gain.gain.value = 0.08;

      const filter =
        audioContext.createBiquadFilter();

      filter.type = "bandpass";

      filter.frequency.setValueAtTime(
        freq * 2.2,
        now
      );

      filter.Q.value = 2.2;

      const breath =
        audioContext.createBufferSource();

      const bufferSize =
        audioContext.sampleRate * 0.18;

      const buffer =
        audioContext.createBuffer(
          1,
          bufferSize,
          audioContext.sampleRate
        );

      const data =
        buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {

        data[i] =
          (Math.random() * 2 - 1) *
          (1 - i / bufferSize);
      }

      breath.buffer = buffer;

      const breathGain =
        audioContext.createGain();

      breathGain.gain.setValueAtTime(
        0.025,
        now
      );

      breathGain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.18
      );

      osc1.connect(filter);

      osc2.connect(osc2Gain);

      osc2Gain.connect(filter);

      breath.connect(breathGain);

      breathGain.connect(filter);

      filter.connect(gain);

      gain.connect(audioContext.destination);

      osc1.start(now);
      osc2.start(now);
      breath.start(now);

      osc1.stop(now + 1.4);
      osc2.stop(now + 1.4);
      breath.stop(now + 0.18);
    }

    function flashButton(button) {

      button.classList.add("active");

      setTimeout(() => {

        button.classList.remove("active");

      }, 160);
    }

    function triggerButton(button) {

      if (
        !button ||
        button === currentFingerButton
      ) return;

      currentFingerButton = button;

      playNote(
        parseFloat(button.dataset.note)
      );

      statusText.textContent =
        button.dataset.name;

      flashButton(button);
    }

    function buttonFromPoint(x, y) {

      const element =
        document.elementFromPoint(x, y);

      if (
        element &&
        element.classList.contains("square")
      ) {
        return element;
      }

      return null;
    }

    document
      .querySelectorAll(".square")
      .forEach(button => {

        button.addEventListener(
          "pointerdown",
          event => {

            event.preventDefault();

            triggerButton(button);
          }
        );
      });

    document.addEventListener(
      "pointermove",
      event => {

        if (
          event.buttons !== 1 &&
          event.pointerType === "mouse"
        ) return;

        const button =
          buttonFromPoint(
            event.clientX,
            event.clientY
          );

        if (button)
          triggerButton(button);
      }
    );

    document.addEventListener(
      "pointerup",
      () => {
        currentFingerButton = null;
      }
    );

    document.addEventListener(
      "pointercancel",
      () => {
        currentFingerButton = null;
      }
    );

  </script>

</body>
</html>
