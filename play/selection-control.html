<!DOCTYPE html>
<html>
<head>
  <title>Orumi Selection Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/orumi-catalog.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 120px;
      box-sizing: border-box;
      overflow-y: auto;
      touch-action: manipulation;
      user-select: none;
    }

    h1 {
      margin: 10px 0 6px;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      color: #ccc;
      margin-bottom: 18px;
      font-size: 15px;
      text-align: center;
    }

    .top-button {
      position: fixed;
      top: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      text-decoration: none;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: #222;
      background: rgba(255,255,255,0.86);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
      z-index: 1000;
      transition: 0.12s;
    }

    .top-button:hover,
    .top-button:active {
      transform: scale(0.94);
      filter: brightness(1.08);
    }

    .back-button { left: 18px; }
    .player-button { right: 18px; }

    .accordion {
      width: min(92vmin, 720px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel {
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
      overflow: hidden;
    }

    .panel-header {
      width: 100%;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      text-align: left;
    }

    .panel-current {
      color: #ccc;
      font-weight: 700;
      font-size: 13px;
      margin-left: 10px;
      text-align: right;
    }

    .panel-arrow {
      margin-left: 10px;
      transition: 0.15s;
    }

    .panel.open .panel-arrow {
      transform: rotate(180deg);
    }

    .panel-content {
      display: none;
      padding: 12px;
    }

    .panel.open .panel-content {
      display: block;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .system-grid,
    .family-grid,
    .mode-grid,
    .voice-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .key-grid {
      grid-template-columns: repeat(6, 1fr);
    }

    .tone-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .octave-grid {
      grid-template-columns: repeat(6, 1fr);
    }

    .square {
      border: none;
      border-radius: 16px;
      min-height: 72px;
      font-size: clamp(11px, 2.2vmin, 18px);
      font-weight: bold;
      color: white;
      background: #333;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: 0.12s;
      cursor: pointer;
      text-align: center;
      padding: 6px;
      line-height: 1.15;
    }

    .square.selected {
      transform: scale(0.94);
      outline: 4px solid rgba(255,255,255,0.98);
      outline-offset: -5px;
      filter: brightness(1.3);
      box-shadow:
        0 0 28px rgba(255,255,255,0.9),
        0 6px 14px rgba(0,0,0,0.35);
    }

    .system-square { background: #2f3542; }
    .family-square { background: #3a4658; }
    .mode-square { background: #3b3b50; }
    .tone-square { background: #2c2c2c; }
    .voice-square { background: #38444a; }
    .octave-square { background: #3b3b3b; }

    .apply-bar {
      position: sticky;
      bottom: 0;
      width: 100%;
      max-width: 720px;
      padding: 12px 12px 16px;
      background: linear-gradient(
        to top,
        rgba(17,17,17,0.98),
        rgba(17,17,17,0.86)
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 900;
      margin-top: 18px;
    }

    #selectionLabel {
      color: #ccc;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      min-height: 22px;
      text-align: center;
      line-height: 1.35;
    }

    #enterButton {
      padding: 12px 22px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .c  { background: #ff6b6b; }
    .db { background: linear-gradient(135deg, #ff6b6b, #f7b267); }
    .d  { background: #f7b267; }
    .eb { background: linear-gradient(135deg, #f7b267, #ffd93d); color: #222; }
    .e  { background: #ffd93d; color: #222; }
    .f  { background: #6bcb77; }
    .gb { background: linear-gradient(135deg, #6bcb77, #4d96ff); }
    .g  { background: #4d96ff; }
    .ab { background: linear-gradient(135deg, #4d96ff, #9d4edd); }
    .a  { background: #9d4edd; }
    .bb { background: linear-gradient(135deg, #9d4edd, #ff8fab); }
    .b  { background: #ff8fab; }
  </style>
</head>

<body>

  <a
    class="top-button back-button"
    href="index.html"
    title="Return to Home Screen"
  >←</a>

  <a
    class="top-button player-button"
    id="playerButton"
    href="player.html"
    title="Open Note Player"
  >♫</a>

  <h1>Orumi Selection Control</h1>

  <div class="subtitle">
    Adjust the musical world, scale, display, octaves, and voice.
  </div>

  <div class="accordion">

    <div class="panel open" id="systemPanel">
      <button class="panel-header" data-panel="systemPanel">
        <span>System</span>
        <span>
          <span class="panel-current" id="systemCurrent"></span>
          <span class="panel-arrow">⌄</span>
        </span>
      </button>
      <div class="panel-content">
        <div class="grid system-grid" id="systemGrid"></div>
      </div>
    </div>

    <div class="panel" id="rootPanel">
      <button class="panel-header" data-panel="rootPanel">
        <span>Root</span>
        <span>
          <span class="panel-current" id="rootCurrent"></span>
          <span class="panel-arrow">⌄</span>
        </span>
      </button>
      <div class="panel-content">
        <div class="grid key-grid" id="keyGrid"></div>
      </div>
    </div>

    <div class="panel" id="familyPanel">
      <button class="panel-header" data-panel="familyPanel">
        <span>Scale Family</span>
        <span>
          <span class="panel-current" id="familyCurrent"></span>
          <span class="panel-arrow">⌄</span>
        </span>
      </button>
      <div class="panel-content">
        <div class="grid family-grid" id="familyGrid"></div>
      </div>
    </div>

    <div class="panel" id="modePanel">
      <button class="panel-header" data-panel="modePanel">
        <span>Specific Mode</span>
        <span>
          <span class="panel-current" id="modeCurrent"></span>
          <span class="panel-arrow">⌄</span>
        </span>
      </button>
      <div class="panel-content">
        <div class="grid mode-grid" id="modeGrid"></div>
      </div>
    </div>

    <div class="panel" id="tonePanel">
      <button class="panel-header" data-panel="tonePanel">
        <span>Tone Display</span>
        <span>
          <span class="panel-current" id="toneCurrent"></span>
          <span class="panel-arrow">⌄</span>
        </span>
      </button>
      <div class="panel-content">
        <div class="grid tone-grid" id="toneGrid">
          <button class="square tone-square" data-set="native">Native Only</button>
          <button class="square tone-square" data-set="full">Full Set</button>
        </div>
      </div>
    </div>

    <div class="panel" id="octavePanel">
      <button class="panel-header" data-panel="octavePanel">
        <span>Visible Octaves</span>
        <span>
          <span class="panel-current" id="octaveCurrent"></span>
          <span class="panel-arrow">⌄</span>
        </span>
      </button>
      <div class="panel-content">
        <div class="grid octave-grid" id="octaveGrid">
          <button class="square octave-square" data-octave="1">1</button>
          <button class="square octave-square" data-octave="2">2</button>
          <button class="square octave-square" data-octave="3">3</button>
          <button class="square octave-square" data-octave="4">4</button>
          <button class="square octave-square" data-octave="5">5</button>
          <button class="square octave-square" data-octave="6">6</button>
        </div>
      </div>
    </div>

    <div class="panel" id="voicePanel">
      <button class="panel-header" data-panel="voicePanel">
        <span>Voice</span>
        <span>
          <span class="panel-current" id="voiceCurrent"></span>
          <span class="panel-arrow">⌄</span>
        </span>
      </button>
      <div class="panel-content">
        <div class="grid voice-grid" id="voiceGrid"></div>
      </div>
    </div>

  </div>

  <div class="apply-bar">
    <div id="selectionLabel"></div>
    <button id="enterButton">Enter Grid</button>
  </div>

  <script>
    const catalog = ORUMI_CATALOG;
    const systems = catalog.systems;
    const pitchClasses = catalog.pitchClasses;
    const voices = catalog.voices;

    const params = new URLSearchParams(window.location.search);

    const playerButton = document.getElementById("playerButton");
    const systemGrid = document.getElementById("systemGrid");
    const keyGrid = document.getElementById("keyGrid");
    const familyGrid = document.getElementById("familyGrid");
    const modeGrid = document.getElementById("modeGrid");
    const voiceGrid = document.getElementById("voiceGrid");
    const selectionLabel = document.getElementById("selectionLabel");
    const enterButton = document.getElementById("enterButton");

    const systemCurrent = document.getElementById("systemCurrent");
    const rootCurrent = document.getElementById("rootCurrent");
    const familyCurrent = document.getElementById("familyCurrent");
    const modeCurrent = document.getElementById("modeCurrent");
    const toneCurrent = document.getElementById("toneCurrent");
    const octaveCurrent = document.getElementById("octaveCurrent");
    const voiceCurrent = document.getElementById("voiceCurrent");

    let selectedSystemKey =
      params.get("system") || "western";

    let startingSystem =
      systems[selectedSystemKey] || systems.western;

    selectedSystemKey =
      systems[selectedSystemKey] ? selectedSystemKey : "western";

    let selectedRoot =
      params.get("root") ||
      startingSystem.defaultRoot ||
      "C";

    let selectedFamilyKey =
      params.get("family") ||
      params.get("architecture") ||
      startingSystem.defaultFamily;

    let selectedModeKey =
      params.get("scaleMode") ||
      params.get("mode") ||
      startingSystem.defaultMode;

    let selectedSet =
      params.get("set") ||
      startingSystem.defaultSet ||
      "native";

    let selectedOctaves =
      params.get("octaves")
        ? params.get("octaves")
            .split(",")
            .map(value => parseInt(value, 10))
            .filter(value => value >= 1 && value <= 6)
        : [...(startingSystem.defaultOctaves || [2,3,4,5])];

    if (selectedOctaves.length === 0) {
      selectedOctaves =
        [...(startingSystem.defaultOctaves || [2,3,4,5])];
    }

    let selectedVoice =
      params.get("voice") ||
      startingSystem.defaultVoice ||
      "warm";

    if (!voices[selectedVoice]) {
      selectedVoice = startingSystem.defaultVoice || "warm";
    }

    document.querySelectorAll(".panel-header").forEach(header => {
      header.addEventListener("click", () => {
        const panel = document.getElementById(header.dataset.panel);
        panel.classList.toggle("open");
      });
    });

    function currentSystem() {
      return systems[selectedSystemKey] || systems.western;
    }

    function currentFamily() {
      const system = currentSystem();

      return system.families[selectedFamilyKey] ||
        system.families[system.defaultFamily];
    }

    function currentMode() {
      const family = currentFamily();

      return family.modes[selectedModeKey] ||
        family.modes[Object.keys(family.modes)[0]];
    }

    function validateCurrentSelections() {
      const system = currentSystem();

      if (!pitchClasses[selectedRoot]) {
        selectedRoot = system.defaultRoot || "C";
      }

      if (!system.families[selectedFamilyKey]) {
        selectedFamilyKey = system.defaultFamily;
      }

      const family = currentFamily();

      if (!family.modes[selectedModeKey]) {
        selectedModeKey =
          system.defaultMode &&
          family.modes[system.defaultMode]
            ? system.defaultMode
            : Object.keys(family.modes)[0];
      }

      if (selectedSet !== "native" && selectedSet !== "full") {
        selectedSet = system.defaultSet || "native";
      }

      selectedOctaves = selectedOctaves
        .filter(value => value >= 1 && value <= 6)
        .sort((a, b) => a - b);

      if (selectedOctaves.length === 0) {
        selectedOctaves =
          [...(system.defaultOctaves || [2,3,4,5])];
      }

      if (!voices[selectedVoice]) {
        selectedVoice = system.defaultVoice || "warm";
      }
    }

    function buildPlayerUrl() {
      validateCurrentSelections();

      const system = encodeURIComponent(selectedSystemKey);
      const root = encodeURIComponent(selectedRoot);
      const family = encodeURIComponent(selectedFamilyKey);
      const scaleMode = encodeURIComponent(selectedModeKey);
      const setView = encodeURIComponent(selectedSet);
      const octaves = encodeURIComponent(selectedOctaves.join(","));
      const voice = encodeURIComponent(selectedVoice);

      return (
        "player.html" +
        "?system=" + system +
        "&root=" + root +
        "&family=" + family +
        "&scaleMode=" + scaleMode +
        "&set=" + setView +
        "&octaves=" + octaves +
        "&voice=" + voice
      );
    }

    function refreshPlayerLink() {
      playerButton.href = buildPlayerUrl();
    }

    function buildSystemGrid() {
      systemGrid.innerHTML = "";

      Object.entries(systems).forEach(([key, system]) => {
        const button = document.createElement("button");

        button.classList.add("square", "system-square");

        if (key === selectedSystemKey) {
          button.classList.add("selected");
        }

        button.textContent = system.label;

        button.addEventListener("click", () => {
          selectedSystemKey = key;

          const newSystem = currentSystem();

          selectedRoot = newSystem.defaultRoot || "C";
          selectedFamilyKey = newSystem.defaultFamily;
          selectedModeKey = newSystem.defaultMode;
          selectedSet = newSystem.defaultSet || "native";
          selectedOctaves =
            [...(newSystem.defaultOctaves || [2,3,4,5])];
          selectedVoice = newSystem.defaultVoice || "warm";

          buildAll();
        });

        systemGrid.appendChild(button);
      });
    }

    function buildKeyGrid() {
      keyGrid.innerHTML = "";

      Object.entries(pitchClasses).forEach(([key, pitch]) => {
        const button = document.createElement("button");

        button.classList.add("square", pitch.className);

        if (key === selectedRoot) {
          button.classList.add("selected");
        }

        button.textContent = pitch.display;

        button.addEventListener("click", () => {
          selectedRoot = key;
          buildKeyGrid();
          updateDisplay();
        });

        keyGrid.appendChild(button);
      });
    }

    function buildFamilyGrid() {
      familyGrid.innerHTML = "";

      Object.entries(currentSystem().families).forEach(([key, family]) => {
        const button = document.createElement("button");

        button.classList.add("square", "family-square");

        if (key === selectedFamilyKey) {
          button.classList.add("selected");
        }

        button.textContent = family.label;

        button.addEventListener("click", () => {
          selectedFamilyKey = key;
          selectedModeKey = Object.keys(currentFamily().modes)[0];

          buildFamilyGrid();
          buildModeGrid();
          updateDisplay();
        });

        familyGrid.appendChild(button);
      });
    }

    function buildModeGrid() {
      modeGrid.innerHTML = "";

      Object.entries(currentFamily().modes).forEach(([key, mode]) => {
        const button = document.createElement("button");

        button.classList.add("square", "mode-square");

        if (key === selectedModeKey) {
          button.classList.add("selected");
        }

        button.textContent = mode.shortLabel || mode.label;

        button.addEventListener("click", () => {
          selectedModeKey = key;
          buildModeGrid();
          updateDisplay();
        });

        modeGrid.appendChild(button);
      });
    }

    function buildVoiceGrid() {
      voiceGrid.innerHTML = "";

      Object.entries(voices).forEach(([key, voice]) => {
        const button = document.createElement("button");

        button.classList.add("square", "voice-square");

        if (key === selectedVoice) {
          button.classList.add("selected");
        }

        button.textContent = voice.label;

        button.addEventListener("click", () => {
          selectedVoice = key;
          buildVoiceGrid();
          updateDisplay();
        });

        voiceGrid.appendChild(button);
      });
    }

    function updateToneButtons() {
      document.querySelectorAll(".tone-square").forEach(button => {
        button.classList.toggle(
          "selected",
          button.dataset.set === selectedSet
        );
      });
    }

    function updateOctaveButtons() {
      document.querySelectorAll(".octave-square").forEach(button => {
        const octave = parseInt(button.dataset.octave, 10);

        button.classList.toggle(
          "selected",
          selectedOctaves.includes(octave)
        );
      });
    }

    document.querySelectorAll(".tone-square").forEach(button => {
      button.addEventListener("click", () => {
        selectedSet = button.dataset.set;
        updateToneButtons();
        updateDisplay();
      });
    });

    document.querySelectorAll(".octave-square").forEach(button => {
      button.addEventListener("click", () => {
        const octave = parseInt(button.dataset.octave, 10);

        if (selectedOctaves.includes(octave)) {
          selectedOctaves =
            selectedOctaves.filter(o => o !== octave);
        } else {
          selectedOctaves.push(octave);
        }

        selectedOctaves.sort((a,b) => a - b);

        if (selectedOctaves.length === 0) {
          selectedOctaves =
            [...(currentSystem().defaultOctaves || [2,3,4,5])];
        }

        updateOctaveButtons();
        updateDisplay();
      });
    });

    function updateDisplay() {
      validateCurrentSelections();

      const system = currentSystem();
      const family = currentFamily();
      const mode = currentMode();
      const pitch = pitchClasses[selectedRoot];
      const voice = voices[selectedVoice];

      systemCurrent.textContent = system.label;
      rootCurrent.textContent = pitch.display;
      familyCurrent.textContent = family.label;
      modeCurrent.textContent = mode.label;
      toneCurrent.textContent =
        selectedSet === "native" ? "Native Only" : "Full Set";
      octaveCurrent.textContent = selectedOctaves.join(",");
      voiceCurrent.textContent = voice.label;

      selectionLabel.textContent =
        system.label +
        " · " +
        pitch.display +
        " · " +
        family.label +
        " · " +
        mode.label +
        " · " +
        (selectedSet === "native" ? "Native Only" : "Full Set") +
        " · Octaves " +
        selectedOctaves.join(",") +
        " · " +
        voice.label;

      refreshPlayerLink();
    }

    enterButton.addEventListener("click", () => {
      window.location.href = buildPlayerUrl();
    });

    function buildAll() {
      validateCurrentSelections();

      buildSystemGrid();
      buildKeyGrid();
      buildFamilyGrid();
      buildModeGrid();
      updateToneButtons();
      updateOctaveButtons();
      buildVoiceGrid();
      updateDisplay();
    }

    buildAll();
  </script>

</body>
</html>
