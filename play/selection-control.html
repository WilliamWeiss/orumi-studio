<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orumi Selection Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/orumi-catalog.js"></script>

  <style>
    :root {
      --orumi-bg: #111111;
      --orumi-text: #f5f0e8;
      --orumi-muted: #b9b3a4;
      --orumi-soft: #8f8878;
      --orumi-gold: #d6b76a;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--orumi-bg);
      color: var(--orumi-text);
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 80px;
      box-sizing: border-box;
      user-select: none;
    }

    h1 {
      text-align: center;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    .subtitle {
      color: var(--orumi-muted);
      text-align: center;
      max-width: 760px;
      margin: 0 auto 18px;
      font-size: 14px;
      line-height: 1.4;
    }



    .design-studio-mini-icon {
      width: 30px;
      height: 30px;
      overflow: visible;
      filter: drop-shadow(0 5px 9px rgba(0,0,0,0.30));
    }

    .design-studio-mini-icon .ds-grid-line {
      stroke: rgba(245,240,232,0.62);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .design-studio-mini-icon .ds-selected-square {
      fill: #4d96ff;
      stroke: rgba(255,255,255,0.94);
      stroke-width: 2;
    }

    .design-studio-mini-icon .ds-selection-handle {
      fill: #f5f0e8;
      stroke: rgba(0,0,0,0.28);
      stroke-width: 1;
    }

    .design-studio-mini-icon .ds-ghost-square {
      fill: rgba(255,255,255,0.18);
      stroke: rgba(255,255,255,0.20);
      stroke-width: 1;
    }

    .top-button {
      position: fixed;
      top: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      text-decoration: none;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: #222;
      background: rgba(255,255,255,0.86);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      z-index: 1000;
      transition: 0.12s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .top-button:hover,
    .top-button:active {
      transform: scale(0.94);
      filter: brightness(1.08);
    }

    button.button-success { animation: buttonSuccess 0.6s ease forwards; }
    @keyframes buttonSuccess {
      0%   { box-shadow: 0 0 0px rgba(34,211,238,0);   border-color: rgba(34,211,238,0); }
      25%  { box-shadow: 0 0 18px rgba(34,211,238,0.8); border-color: rgba(34,211,238,0.9); color: #a5f3fc; }
      100% { box-shadow: 0 0 0px rgba(34,211,238,0);   border-color: inherit; color: inherit; }
    }

    .back-button { left: 88px; }
    .home-button { right: 18px; }
    .player-button { right: 76px; }
    .design-button { right: 134px; }

    .logo-button {
      left: 18px;
      width: 58px;
      height: 58px;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
      overflow: hidden;
    }

    .logo-button:hover,
    .logo-button:active {
      background: transparent;
      box-shadow: none;
      filter: brightness(1.12);
    }

    .logo-button img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      display: block;
    }

    .control-panel {
      width: min(96vw, 920px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section {
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      color: var(--orumi-muted);
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .system-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .root-grid {
      grid-template-columns: repeat(6, 1fr);
    }

    .family-grid,
    .mode-grid,
    .voice-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .set-grid,
    .octave-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .square {
      border: none;
      border-radius: 16px;
      min-height: 58px;
      font-size: clamp(12px, 2.2vmin, 17px);
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: 0.12s;
      text-align: center;
      padding: 6px;
      line-height: 1.15;
      font-family: inherit;
    }

    .square:hover,
    .square:active {
      transform: scale(0.96);
      filter: brightness(1.12);
    }

    .square.selected {
      outline: 4px solid rgba(255,255,255,1);
      outline-offset: -4px;
      filter: brightness(1.42);
      box-shadow:
        0 0 36px rgba(255,255,255,0.88),
        0 0 18px rgba(255,230,150,0.65),
        0 6px 14px rgba(0,0,0,0.35);
    }

    .control-square {
      background: #38444a;
    }

    .summary {
      text-align: center;
      color: var(--orumi-muted);
      font-size: 15px;
      line-height: 1.45;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
    }

    .action-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .action-button {
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      text-align: center;
      text-decoration: none;
      font-family: inherit;
    }

    .action-button.secondary {
      background: rgba(255,255,255,0.16);
      color: #fff7ea;
    }

    .c  { background: #ff6b6b; }
    .db { background: linear-gradient(135deg, #ff6b6b, #f7b267); }
    .d  { background: #f7b267; }
    .eb { background: linear-gradient(135deg, #f7b267, #ffd93d); color: #222; }
    .e  { background: #ffd93d; color: #222; }
    .f  { background: #6bcb77; }
    .gb { background: linear-gradient(135deg, #6bcb77, #4d96ff); }
    .g  { background: #4d96ff; }
    .ab { background: linear-gradient(135deg, #4d96ff, #9d4edd); }
    .a  { background: #9d4edd; }
    .bb { background: linear-gradient(135deg, #9d4edd, #ff8fab); }
    .b  { background: #ff8fab; }

    @media (max-width: 760px) {
      h1 {
        margin-top: 72px;
      }

      .system-grid,
      .family-grid,
      .mode-grid,
      .voice-grid,
      .set-grid,
      .octave-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .root-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .action-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <a
    class="top-button logo-button"
    href="../index.html"
    title="Orumi Home"
    aria-label="Orumi Home"
  >
    <img src="../assets/orumi-icon.png" alt="Orumi" />
  </a>

  <button
    class="top-button back-button"
    id="backButton"
    title="Go Back"
  >←</button>

  <a
    class="top-button home-button"
    href="index.html"
    title="Orumi Play Home"
  >⌂</a>

  <a
    class="top-button player-button"
    id="playerButton"
    href="player.html"
    title="Open Player"
  >□</a>

  <a
    class="top-button design-button"
    id="designButton"
    href="design-studio.html"
    title="Open Design Studio"
  ><svg class="design-studio-mini-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <line class="ds-grid-line" x1="9" y1="15" x2="55" y2="15"></line>
      <line class="ds-grid-line" x1="9" y1="27" x2="55" y2="27"></line>
      <line class="ds-grid-line" x1="9" y1="39" x2="55" y2="39"></line>
      <line class="ds-grid-line" x1="9" y1="51" x2="55" y2="51"></line>
      <rect class="ds-ghost-square" x="14" y="10" width="10" height="10" rx="2"></rect>
      <rect class="ds-ghost-square" x="40" y="34" width="10" height="10" rx="2"></rect>
      <rect class="ds-selected-square" x="26" y="21" width="16" height="16" rx="3"></rect>
      <rect class="ds-selection-handle" x="22" y="17" width="6" height="6" rx="1"></rect>
      <rect class="ds-selection-handle" x="40" y="17" width="6" height="6" rx="1"></rect>
      <rect class="ds-selection-handle" x="22" y="35" width="6" height="6" rx="1"></rect>
      <rect class="ds-selection-handle" x="40" y="35" width="6" height="6" rx="1"></rect>
    </svg></a>

  <h1>Selection Control</h1>

  <div class="subtitle">
    Choose the musical world, key center, scale family, mode, octave range,
    voice, and note set for the Orumi Player.
  </div>

  <div class="control-panel">

    <div class="section">
      <div class="section-title">Sound System</div>
      <div class="grid system-grid" id="systemGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Key Center</div>
      <div class="grid root-grid" id="rootGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Note Family</div>
      <div class="grid family-grid" id="familyGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Mode / Scale</div>
      <div class="grid mode-grid" id="modeGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Note Set</div>
      <div class="grid set-grid" id="setGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Octaves</div>
      <div class="grid octave-grid" id="octaveGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Voice</div>
      <div class="grid voice-grid" id="voiceGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">Current Selection</div>

      <div class="summary" id="summary">
        Selection loading...
      </div>

      <div class="action-row" style="margin-top: 14px;">
        <a
          class="action-button"
          id="openPlayerButton"
          href="player.html"
        >
          Open Player
        </a>

        <a
          class="action-button secondary"
          id="openChordFactoryButton"
          href="design-studio.html"
        >
          Open Design Studio
        </a>

        <button
          class="action-button secondary"
          id="resetButton"
        >
          Reset to Defaults
        </button>
      </div>
    </div>

  </div>

  <script>
    const backButton =
      document.getElementById("backButton");

    const playerButton =
      document.getElementById("playerButton");

    const designButton =
      document.getElementById("designButton");

    const openPlayerButton =
      document.getElementById("openPlayerButton");

    const openDesignStudioButton =
      document.getElementById("openChordFactoryButton");

    const resetButton =
      document.getElementById("resetButton");

    const systemGrid =
      document.getElementById("systemGrid");

    const rootGrid =
      document.getElementById("rootGrid");

    const familyGrid =
      document.getElementById("familyGrid");

    const modeGrid =
      document.getElementById("modeGrid");

    const setGrid =
      document.getElementById("setGrid");

    const octaveGrid =
      document.getElementById("octaveGrid");

    const voiceGrid =
      document.getElementById("voiceGrid");

    const summary =
      document.getElementById("summary");

    const systems =
      ORUMI_CATALOG.systems;

    const voices =
      ORUMI_CATALOG.voices;

    const pitchClasses =
      ORUMI_CATALOG.pitchClasses;

    const numberToPitchClass =
      ORUMI_CATALOG.numberToPitchClass;

    const params =
      new URLSearchParams(window.location.search);

    let selectedSystemKey =
      params.get("system") || "western";

    if (!systems[selectedSystemKey]) {
      selectedSystemKey = "western";
    }

    let selectedSystem =
      systems[selectedSystemKey];

    let selectedRoot =
      params.get("root") ||
      selectedSystem.defaultRoot ||
      "C";

    if (!pitchClasses[selectedRoot]) {
      selectedRoot = "C";
    }

    let selectedFamily =
      params.get("family") ||
      selectedSystem.defaultFamily ||
      Object.keys(selectedSystem.families || {})[0];

    let selectedMode =
      params.get("scaleMode") ||
      selectedSystem.defaultMode;

    let selectedSet =
      params.get("set") ||
      selectedSystem.defaultSet ||
      "native";

    if (!["native", "full"].includes(selectedSet)) {
      selectedSet = "native";
    }

    let selectedVoice =
      params.get("voice") ||
      selectedSystem.defaultVoice ||
      "softKeys";

    if (!voices[selectedVoice]) {
      selectedVoice =
        selectedSystem.defaultVoice || "softKeys";
    }

    let selectedOctaves =
      parseOctaves(
        params.get("octaves") ||
        (selectedSystem.defaultOctaves || [3,4,5]).join(",")
      );

    let showAllVoices =
      params.get("showVoices") === "all";

    backButton.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });

    document.addEventListener("pointerdown", event => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      button.classList.remove("button-success");
      window.requestAnimationFrame(() => {
        button.classList.add("button-success");
        window.setTimeout(() => button.classList.remove("button-success"), 620);
      });
    });

    resetButton.addEventListener("click", () => {
      selectedSystemKey = "western";
      selectedSystem = systems[selectedSystemKey];
      selectedRoot = selectedSystem.defaultRoot || "C";
      selectedFamily = selectedSystem.defaultFamily || "diatonic";
      selectedMode = selectedSystem.defaultMode || "ionian";
      selectedSet = selectedSystem.defaultSet || "native";
      selectedVoice = selectedSystem.defaultVoice || "softKeys";
      selectedOctaves = [...(selectedSystem.defaultOctaves || [3,4,5])];

      buildAll();
    });

    function parseOctaves(value) {
      const parsed =
        String(value)
          .split(",")
          .map(item => parseInt(item.trim(), 10))
          .filter(item => Number.isInteger(item));

      const valid =
        parsed.filter(item => [2,3,4,5].includes(item));

      return valid.length > 0
        ? [...new Set(valid)].sort((a,b) => a - b)
        : [3,4,5];
    }

    function pcToName(pcNumber) {
      return numberToPitchClass[
        ((pcNumber % 12) + 12) % 12
      ];
    }

    function getChromaticFromRoot(rootName) {
      const rootNumber =
        pitchClasses[rootName].number;

      const result = [];

      for (let i = 0; i < 12; i++) {
        result.push(pcToName(rootNumber + i));
      }

      return result;
    }

    function getFamilies() {
      return selectedSystem.families || {};
    }

    function getCurrentFamily() {
      const families = getFamilies();

      if (!families[selectedFamily]) {
        selectedFamily =
          selectedSystem.defaultFamily ||
          Object.keys(families)[0];
      }

      return families[selectedFamily];
    }

    function getModes() {
      const family =
        getCurrentFamily();

      return family && family.modes
        ? family.modes
        : {};
    }

    function getCurrentMode() {
      const modes =
        getModes();

      if (!modes[selectedMode]) {
        selectedMode =
          selectedSystem.defaultMode ||
          Object.keys(modes)[0];
      }

      return modes[selectedMode];
    }

    function makeButton(label, classNames, isSelected, onClick) {
      const button =
        document.createElement("button");

      button.classList.add("square");

      classNames.forEach(className => {
        button.classList.add(className);
      });

      if (isSelected) {
        button.classList.add("selected");
      }

      button.textContent = label;

      button.addEventListener("click", onClick);

      return button;
    }

    function buildSystemGrid() {
      systemGrid.innerHTML = "";

      Object.entries(systems).forEach(([key, system]) => {
        const button =
          makeButton(
            system.label || key,
            ["control-square"],
            key === selectedSystemKey,
            () => {
              selectedSystemKey = key;
              selectedSystem = systems[selectedSystemKey];

              selectedRoot =
                selectedSystem.defaultRoot || "C";

              selectedFamily =
                selectedSystem.defaultFamily ||
                Object.keys(selectedSystem.families || {})[0];

              selectedMode =
                selectedSystem.defaultMode ||
                Object.keys(getModes())[0];

              selectedSet =
                selectedSystem.defaultSet || "native";

              selectedVoice =
                selectedSystem.defaultVoice || "softKeys";

              if (!voices[selectedVoice]) {
                selectedVoice = "softKeys";
              }

              selectedOctaves =
                [...(selectedSystem.defaultOctaves || [3,4,5])];

              buildAll();
            }
          );

        systemGrid.appendChild(button);
      });
    }

    function buildRootGrid() {
      rootGrid.innerHTML = "";

      const roots =
        getChromaticFromRoot(selectedRoot);

      roots.forEach(root => {
        const pitch =
          pitchClasses[root];

        const button =
          makeButton(
            pitch.display,
            [pitch.className],
            root === selectedRoot,
            () => {
              selectedRoot = root;
              buildAll();
            }
          );

        rootGrid.appendChild(button);
      });
    }

    function buildFamilyGrid() {
      familyGrid.innerHTML = "";

      const families =
        getFamilies();

      const entries =
        Object.entries(families);

      if (entries.length === 0) {
        return;
      }

      if (!families[selectedFamily]) {
        selectedFamily = entries[0][0];
      }

      entries.forEach(([key, family]) => {
        const button =
          makeButton(
            family.label || key,
            ["control-square"],
            key === selectedFamily,
            () => {
              selectedFamily = key;

              const modes =
                getModes();

              selectedMode =
                Object.keys(modes)[0] ||
                selectedMode;

              buildAll();
            }
          );

        familyGrid.appendChild(button);
      });
    }

    function buildModeGrid() {
      modeGrid.innerHTML = "";

      const modes =
        getModes();

      const entries =
        Object.entries(modes);

      if (entries.length === 0) {
        return;
      }

      if (!modes[selectedMode]) {
        selectedMode = entries[0][0];
      }

      entries.forEach(([key, mode]) => {
        const button =
          makeButton(
            mode.label || key,
            ["control-square"],
            key === selectedMode,
            () => {
              selectedMode = key;
              buildAll();
            }
          );

        modeGrid.appendChild(button);
      });
    }

    function buildSetGrid() {
      setGrid.innerHTML = "";

      [
        {
          key: "native",
          label: "Native Only"
        },
        {
          key: "full",
          label: "Full Set"
        }
      ].forEach(item => {
        const button =
          makeButton(
            item.label,
            ["control-square"],
            item.key === selectedSet,
            () => {
              selectedSet = item.key;
              buildAll();
            }
          );

        setGrid.appendChild(button);
      });
    }

    function buildOctaveGrid() {
      octaveGrid.innerHTML = "";

      [2,3,4,5].forEach(octave => {
        const button =
          makeButton(
            "Octave " + octave,
            ["control-square"],
            selectedOctaves.includes(octave),
            () => {
              if (selectedOctaves.includes(octave)) {
                if (selectedOctaves.length > 1) {
                  selectedOctaves =
                    selectedOctaves.filter(
                      item => item !== octave
                    );
                }
              } else {
                selectedOctaves.push(octave);
              }

              selectedOctaves =
                [...new Set(selectedOctaves)]
                  .sort((a,b) => a - b);

              buildAll();
            }
          );

        octaveGrid.appendChild(button);
      });
    }

    function getDefaultVoiceKeys() {
      const preferred = [
        "softKeys",
        "warm",
        "pure",
        "organ",
        "choir",
        "synth",
        "piano"
      ];

      const systemDefaults =
        Object.values(systems)
          .map(system => system && system.defaultVoice)
          .filter(Boolean);

      const keys =
        [...new Set([...preferred, ...systemDefaults])]
          .filter(key => voices[key]);

      if (voices[selectedVoice] && !keys.includes(selectedVoice) && !showAllVoices) {
        keys.push(selectedVoice);
      }

      return keys.length ? keys : Object.keys(voices).slice(0, 6);
    }

    function buildVoiceGrid() {
      voiceGrid.innerHTML = "";

      const defaultKeys = getDefaultVoiceKeys();
      const allEntries = Object.entries(voices);
      const visibleEntries = showAllVoices
        ? allEntries
        : defaultKeys.map(key => [key, voices[key]]).filter(entry => entry[1]);

      visibleEntries.forEach(([key, voice]) => {
        const button =
          makeButton(
            voice.label || key,
            ["control-square"],
            key === selectedVoice,
            () => {
              selectedVoice = key;
              buildAll();
            }
          );

        voiceGrid.appendChild(button);
      });

      const hiddenCount =
        allEntries.filter(([key]) => !defaultKeys.includes(key)).length;

      if (!showAllVoices && hiddenCount > 0) {
        const moreButton =
          makeButton(
            "More Orumi Sounds…",
            ["control-square"],
            false,
            () => {
              showAllVoices = true;
              buildAll();
            }
          );

        voiceGrid.appendChild(moreButton);
      } else if (showAllVoices && hiddenCount > 0) {
        const fewerButton =
          makeButton(
            "Show Defaults",
            ["control-square"],
            false,
            () => {
              showAllVoices = false;
              buildAll();
            }
          );

        voiceGrid.appendChild(fewerButton);
      }
    }

    function isCustomSetupMode() {
      return params.get("custom") === "1";
    }

    function saveCustomSoundSquareSelection() {
      if (!isCustomSetupMode()) {
        return;
      }

      const family = getCurrentFamily();
      const mode = getCurrentMode();
      const voice = voices[selectedVoice];

      const saved = {
        name:
          (selectedSystem.label || selectedSystemKey) +
          " " +
          (mode ? mode.label : selectedMode),
        systemKey: selectedSystemKey,
        root: selectedRoot,
        familyKey: selectedFamily,
        modeKey: selectedMode,
        setView: selectedSet,
        octaves: selectedOctaves,
        voice: selectedVoice,
        voiceLabel: voice ? voice.label : selectedVoice,
        updatedAt: new Date().toISOString()
      };

      localStorage.setItem("orumiCustomSoundSquare", JSON.stringify(saved));
    }

    function buildUrl(pageName) {
      const urlParams =
        new URLSearchParams();

      urlParams.set("system", selectedSystemKey);
      urlParams.set("root", selectedRoot);
      urlParams.set("family", selectedFamily);
      urlParams.set("scaleMode", selectedMode);
      urlParams.set("set", selectedSet);
      urlParams.set("octaves", selectedOctaves.join(","));
      urlParams.set("voice", selectedVoice);

      if (isCustomSetupMode() && pageName === "player.html") {
        urlParams.set("custom", "1");
      }

      return pageName + "?" + urlParams.toString();
    }

    function updateSummaryAndLinks() {
      const family =
        getCurrentFamily();

      const mode =
        getCurrentMode();

      const voice =
        voices[selectedVoice];

      summary.textContent =
        (isCustomSetupMode() ? "Custom Square · " : "") +
        selectedSystem.label +
        " · " +
        pitchClasses[selectedRoot].display +
        " · " +
        (family ? family.label : selectedFamily) +
        " · " +
        (mode ? mode.label : selectedMode) +
        " · " +
        (selectedSet === "native" ? "Native Only" : "Full Set") +
        " · Octaves " +
        selectedOctaves.join(", ") +
        " · " +
        (voice ? voice.label : selectedVoice);

      const playerUrl =
        buildUrl("player.html");

      const designUrl =
        buildUrl("design-studio.html");

      playerButton.href = playerUrl;
      openPlayerButton.href = playerUrl;

      if (isCustomSetupMode()) {
        openPlayerButton.textContent = "Save Custom Square + Open Player";
      }

      designButton.href = designUrl;
      openDesignStudioButton.href = designUrl;
    }

    if (openPlayerButton) {
      openPlayerButton.addEventListener("click", () => {
        saveCustomSoundSquareSelection();
      });
    }

    if (playerButton) {
      playerButton.addEventListener("click", () => {
        saveCustomSoundSquareSelection();
      });
    }

    function buildAll() {
      getCurrentFamily();
      getCurrentMode();

      buildSystemGrid();
      buildRootGrid();
      buildFamilyGrid();
      buildModeGrid();
      buildSetGrid();
      buildOctaveGrid();
      buildVoiceGrid();
      updateSummaryAndLinks();
    }

    buildAll();
  </script>

</body>
</html>
